# Local development stack (docs/10 §11, ADR-0014). Synthetic data only.
# Start with `make dev`. Images are pinned by digest; bump deliberately.
name: schoolos

x-python-app: &python-app
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    args:
      # Local compose does not need psql in the app image (the db container runs bootstrap.sql).
      INSTALL_PSQL: ${SOS_INSTALL_PSQL:-false}
  image: schoolos-python:dev
  env_file: .env
  environment:
    # The image defaults to SOS_ENV=prod (fail closed); the local stack is always local.
    SOS_ENV: ${SOS_ENV:-local}
    SOS_DATABASE_URL: postgresql+psycopg://sos_app:${SOS_DB_APP_PASSWORD}@db:5432/schoolos
    SOS_PLATFORM_DATABASE_URL: postgresql+psycopg://sos_platform:${SOS_DB_PLATFORM_PASSWORD}@db:5432/schoolos
    SOS_MIGRATOR_DATABASE_URL: postgresql+psycopg://sos_migrator:${SOS_DB_MIGRATOR_PASSWORD}@db:5432/schoolos
    SOS_REDIS_URL: redis://valkey:6379/0
    SOS_S3_ENDPOINT_URL: http://s3:8333
    # The dev OIDC stub is reachable as "oidc" inside the network (issuer stays localhost:8080).
    SOS_OIDC_JWKS_URI: http://oidc:8080/schoolos/jwks
    SOS_PLATFORM_OIDC_JWKS_URI: http://oidc:8080/platform/jwks
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SOS_DB_ADMIN_PASSWORD}
      POSTGRES_DB: schoolos
      SOS_DB_APP_PASSWORD: ${SOS_DB_APP_PASSWORD}
      SOS_DB_MIGRATOR_PASSWORD: ${SOS_DB_MIGRATOR_PASSWORD}
      SOS_DB_PLATFORM_PASSWORD: ${SOS_DB_PLATFORM_PASSWORD}
      SOS_DB_READONLY_PASSWORD: ${SOS_DB_READONLY_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/bootstrap.sql:/sos/bootstrap.sql:ro
      - ./infra/docker/db-init.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    ports: ["127.0.0.1:${SOS_DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schoolos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${SOS_VALKEY_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:latest@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256"]
    volumes:
      - s3data:/data
      - ./infra/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  s3-init:
    <<: *python-app
    restart: "no"
    depends_on:
      s3: { condition: service_healthy }
    command:
      - python
      - -c
      - |
        import boto3, os
        s3 = boto3.client("s3", endpoint_url=os.environ["SOS_S3_ENDPOINT_URL"], region_name=os.environ.get("AWS_REGION", "ap-south-1"))
        existing = {b["Name"] for b in s3.list_buckets().get("Buckets", [])}
        for name in (os.environ["SOS_S3_BUCKET_FILES"], os.environ["SOS_S3_BUCKET_AUDIT"]):
            if name not in existing:
                s3.create_bucket(Bucket=name)
                print("created bucket", name)

  migrate:
    <<: *python-app
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    # Schema migrations, then create audit.events partitions ahead of time (migrator role).
    command: ["sh", "-c", "alembic -c /app/alembic.ini upgrade head && python -m app.audit.partitions --months-ahead 12"]

  api:
    <<: *python-app
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *python-app
    # The worker target adds headless Chromium for the pdf queue (apps/api/Dockerfile, ADR-0025).
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
      args:
        INSTALL_PSQL: ${SOS_INSTALL_PSQL:-false}
    image: schoolos-worker:dev
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    command: ["celery", "-A", "sos_worker.celery_app", "worker", "-Q", "ingest,embed,ocr,dq,exports,pdf,maintenance", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A sos_worker.celery_app inspect ping --timeout 5 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5

  beat:
    <<: *python-app
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    command: ["celery", "-A", "sos_worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: schoolos-web:dev
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
      REDIS_URL: redis://valkey:6379/1
      # Dev OIDC stub: one issuer name for the browser (*.localhost is loopback, RFC 6761)
      # and for this container (the oidc service's network alias). Must equal the API's
      # SOS_OIDC_ISSUER / SOS_PLATFORM_OIDC_ISSUER (see .env.example).
      OIDC_ISSUER: ${OIDC_ISSUER:-http://oidc.localhost:8080/schoolos}
      PLATFORM_OIDC_ISSUER: ${PLATFORM_OIDC_ISSUER:-http://oidc.localhost:8080/platform}
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  # Dev-only OIDC provider (docs/10 §11). Never deployed; the API refuses its issuer outside local.
  oidc:
    profiles: ["dev"]
    image: ghcr.io/navikt/mock-oauth2-server:6.0.3
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/oidc.json
    volumes:
      - ./infra/docker/oidc.json:/config/oidc.json:ro
    ports: ["127.0.0.1:8080:8080"]
    # Containers (web, api) reach the stub as oidc.localhost:8080; browsers reach the same
    # name on 127.0.0.1:8080. The stub derives `iss` from the Host header, so both see
    # http://oidc.localhost:8080/<issuer>. A network alias is used instead of
    # extra_hosts: host-gateway, because the port is published on 127.0.0.1 only and
    # host-gateway cannot reach loopback-bound ports on Linux.
    networks:
      default:
        aliases: [oidc.localhost]

  # Optional malware scanner for uploads (FR-DOC-002, docs/10 §6). Start it with
  # `docker compose --profile av up -d clamav` and set SOS_AV_SCANNER=clamav and
  # SOS_CLAMAV_HOST=clamav for api/worker. First start downloads signatures (several minutes);
  # freshclam inside the container keeps them updated. GPL-2.0 image run as a separate service
  # (never linked into SchoolOS code). Without it the dev-only scanner is used (refused in prod).
  clamav:
    profiles: ["av"]
    image: clamav/clamav:1.4@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303
    volumes:
      - clamdb:/var/lib/clamav
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
  clamdb:
