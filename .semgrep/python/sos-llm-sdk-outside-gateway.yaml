rules:
  - id: sos-llm-sdk-outside-gateway
    message: >-
      LLM/embedding provider SDKs and their credential libraries (anthropic, openai, voyageai,
      google-genai / google.generativeai / vertexai / google.cloud.aiplatform, google.auth,
      google.oauth2) may only be imported inside apps/api/app/knowledge/gateway/ (CLAUDE.md §11,
      ADR-0005, ADR-0033). Call the gateway's service functions instead so redaction, budgets,
      audit and provider settings always apply.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      references:
        - CLAUDE.md §3 and §11
        - docs/06-rag-architecture.md
        - docs/adr/ADR-0033-gemini-on-vertex-ai-for-all-llm-roles.md
    paths:
      include:
        - "/apps/**"
        - "/scripts/**"
        - "/evals/**"
      exclude:
        - "/apps/api/app/knowledge/gateway/**"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import $MOD
              - pattern: import $MOD as $ALIAS
              - pattern: from $MOD import $NAME
              - pattern: from $MOD import $NAME as $ALIAS
              - pattern: importlib.import_module("$MOD", ...)
              - pattern: import_module("$MOD", ...)
              - pattern: __import__("$MOD", ...)
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(anthropic|openai|voyageai|vertexai|google\.genai|google\.generativeai|google\.cloud\.aiplatform|google\.auth|google\.oauth2)(\..+)?$
      - patterns:
          - pattern-either:
              - pattern: from google import $NAME
              - pattern: from google import $NAME as $ALIAS
              - pattern: from google.cloud import $NAME
              - pattern: from google.cloud import $NAME as $ALIAS
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(genai|generativeai|aiplatform|auth|oauth2)$
