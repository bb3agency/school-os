# Staging deploy (shared tier, ECS Fargate) — docs/10 §8 step 1.
#
# main -> build + SBOM + scan -> push to ECR (tag = git SHA; ECR tags are immutable)
#      -> run the one-off migrate task (sos_migrator) -> roll ECS services -> smoke test.
#
# Nothing happens until the repository variables below are configured: the `preflight` job
# reports what is missing in the run summary and every other job is skipped.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   STAGING_AWS_ROLE_ARN        IAM role assumed via GitHub OIDC; trust policy should require
#                               sub = repo:<owner>/<repo>:environment:staging
#   STAGING_ECR_REGISTRY        <account>.dkr.ecr.ap-south-1.amazonaws.com
#   STAGING_ECS_CLUSTER         ECS cluster name
#   STAGING_ECS_SERVICES        space-separated ECS service names = terraform output ecs_services:
#                               sos-staging-api sos-staging-web sos-staging-worker
#                               sos-staging-worker-pdf sos-staging-beat
#                               The API service goes FIRST: the migrate task (Fargate) reuses the first
#                               service's network configuration. worker-pdf is never first (it runs on
#                               the EC2 sandbox capacity without a public IP, ADR-0025) but must be
#                               listed, or the pdf queue keeps running the previous image. The
#                               preflight job fails when either rule is broken.
#   STAGING_MIGRATE_TASK_FAMILY task definition family of the one-off migrate task
#   STAGING_BASE_URL            e.g. https://staging.example.in (used for smoke tests)
# Optional:
#   ECR_REPOSITORY_NAMESPACE    default "schoolos" -> repos schoolos/api, schoolos/worker, schoolos/web
#   STAGING_SMOKE_PATHS         default "/healthz"
# No long-lived AWS secrets are used.
name: deploy-staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never interrupt a deploy half-way through

env:
  AWS_REGION: ap-south-1
  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY: ${{ vars.STAGING_ECR_REGISTRY }}
  ECR_NAMESPACE: ${{ vars.ECR_REPOSITORY_NAMESPACE || 'schoolos' }}

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check deploy configuration
        id: check
        env:
          STAGING_AWS_ROLE_ARN: ${{ vars.STAGING_AWS_ROLE_ARN }}
          STAGING_ECR_REGISTRY: ${{ vars.STAGING_ECR_REGISTRY }}
          STAGING_ECS_CLUSTER: ${{ vars.STAGING_ECS_CLUSTER }}
          STAGING_ECS_SERVICES: ${{ vars.STAGING_ECS_SERVICES }}
          STAGING_MIGRATE_TASK_FAMILY: ${{ vars.STAGING_MIGRATE_TASK_FAMILY }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          missing=()
          for v in STAGING_AWS_ROLE_ARN STAGING_ECR_REGISTRY STAGING_ECS_CLUSTER \
                   STAGING_ECS_SERVICES STAGING_MIGRATE_TASK_FAMILY STAGING_BASE_URL; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging deploy skipped"
              echo "Repository variables not configured: \`${missing[*]}\`."
              echo "See the header of \`.github/workflows/deploy-staging.yml\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Staging deploy skipped; missing repository variables: ${missing[*]}"
          else
            # ADR-0025: worker-pdf is rolled with the rest but never first (the migrate task reuses
            # the first service's Fargate network configuration).
            read -r -a svcs <<< "$STAGING_ECS_SERVICES"
            if [[ "${svcs[0]}" == *-worker-pdf ]]; then
              echo "::error::STAGING_ECS_SERVICES must not start with worker-pdf; list the API service first."
              exit 1
            fi
            has_pdf=false
            for svc in "${svcs[@]}"; do
              [[ "$svc" == *-worker-pdf ]] && has_pdf=true
            done
            if [[ "$has_pdf" != true ]]; then
              echo "::error::STAGING_ECS_SERVICES has no *-worker-pdf service; the pdf queue would keep the old image (terraform output ecs_services)."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build + push (${{ matrix.image }})
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS STS
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: api
          - image: worker
            dockerfile: apps/api/Dockerfile  # worker + beat: api image + headless Chromium (pdf queue)
            target: worker
          - image: web
            dockerfile: apps/web/Dockerfile
            target: ""
    env:
      NAME: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tools
        with:
          tools: syft trivy
      - name: docker build
        run: |
          image="${ECR_REGISTRY}/${ECR_NAMESPACE}/${NAME}:${IMAGE_TAG}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker build --pull -f "$DOCKERFILE" ${TARGET:+--target "$TARGET"} -t "$image" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            .
      - name: SBOM (syft, SPDX JSON)
        run: syft scan "docker:${IMAGE}" -o "spdx-json=sbom-${NAME}.spdx.json" -q
      - name: trivy image scan (gate before push)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --quiet "$IMAGE"
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-staging-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_AWS_ROLE_ARN }}
          role-session-name: gha-staging-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Push to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$IMAGE"
          docker logout "$ECR_REGISTRY"

  deploy:
    name: migrate + roll ECS + smoke
    needs: [preflight, build]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    permissions:
      id-token: write # GitHub OIDC -> AWS STS (no checkout needed in this job)
    env:
      CLUSTER: ${{ vars.STAGING_ECS_CLUSTER }}
      SERVICES: ${{ vars.STAGING_ECS_SERVICES }}
      MIGRATE_FAMILY: ${{ vars.STAGING_MIGRATE_TASK_FAMILY }}
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
      SMOKE_PATHS: ${{ vars.STAGING_SMOKE_PATHS || '/healthz' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_AWS_ROLE_ARN }}
          role-session-name: gha-staging-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Write task-definition helper
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          cat > "$RUNNER_TEMP/deploy/render.sh" <<'EOF'
          #!/usr/bin/env bash
          # render.sh <task-definition ARN or family>
          # Registers a new revision whose containers from our ECR registry use $IMAGE_TAG and
          # prints the new ARN. Other containers (sidecars from other registries) are untouched.
          set -euo pipefail
          out="$RUNNER_TEMP/deploy/td-$RANDOM.json"
          aws ecs describe-task-definition --task-definition "$1" --output json \
            | jq --arg reg "$ECR_REGISTRY" --arg tag "$IMAGE_TAG" '
                .taskDefinition
                | .containerDefinitions |= map(
                    if (.image | startswith($reg + "/"))
                    then .image = ((.image | sub("(@sha256:[0-9a-f]+|:[^:/]+)$"; "")) + ":" + $tag)
                    else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' > "$out"
          aws ecs register-task-definition --cli-input-json "file://$out" \
            --query 'taskDefinition.taskDefinitionArn' --output text
          EOF
          chmod +x "$RUNNER_TEMP/deploy/render.sh"

      - name: Run database migrations (one-off ECS task)
        run: |
          read -r -a svcs <<< "$SERVICES"
          net=$(aws ecs describe-services --cluster "$CLUSTER" --services "${svcs[0]}" \
                  --query 'services[0].networkConfiguration' --output json)
          td=$("$RUNNER_TEMP/deploy/render.sh" "$MIGRATE_FAMILY")
          echo "migrate task definition: $td"
          task=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$td" \
                   --launch-type FARGATE --network-configuration "$net" \
                   --started-by "gha-${GITHUB_RUN_ID}" \
                   --query 'tasks[0].taskArn' --output text)
          if [[ -z "$task" || "$task" == "None" ]]; then
            echo "::error::Migrate task could not be started"; exit 1
          fi
          echo "migrate task: $task"
          # tasks-stopped waiter polls for up to 10 minutes; retry once for long migrations.
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task" \
            || aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"
          aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" \
            --query 'tasks[0].{stopped:stoppedReason,containers:containers[].{name:name,exit:exitCode,reason:reason}}' \
            --output json | tee "$RUNNER_TEMP/deploy/migrate.json"
          bad=$(jq '[.containers[] | select(.exit != 0)] | length' "$RUNNER_TEMP/deploy/migrate.json")
          if [[ "$bad" != "0" ]]; then
            echo "::error::Migrations failed; services were NOT updated. See the migrate task logs in CloudWatch."
            exit 1
          fi

      - name: Roll ECS services
        run: |
          read -r -a svcs <<< "$SERVICES"
          for svc in "${svcs[@]}"; do
            cur=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
                    --query 'services[0].taskDefinition' --output text)
            new=$("$RUNNER_TEMP/deploy/render.sh" "$cur")
            echo "$svc: $cur -> $new"
            aws ecs update-service --cluster "$CLUSTER" --service "$svc" \
              --task-definition "$new" --query 'service.serviceName' --output text
          done
          # Deployment circuit breaker (Terraform) rolls back failed deployments automatically.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "${svcs[@]}" \
            || aws ecs wait services-stable --cluster "$CLUSTER" --services "${svcs[@]}"

      - name: Smoke test
        run: |
          for p in $SMOKE_PATHS; do
            url="${BASE_URL%/}${p}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                     --retry 12 --retry-delay 10 --retry-all-errors "$url")
            echo "$code $p"
            [[ "$code" == 2* ]] || { echo "::error::Smoke test failed: $p returned $code"; exit 1; }
          done
          {
            echo "### Staging deployed"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- services: \`${SERVICES}\`"
          } >> "$GITHUB_STEP_SUMMARY"
