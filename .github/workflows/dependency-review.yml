# Dependency review on pull requests (OpenSSF Scorecard; audit 2026-10-05 hardening, docs/13
# dependencies): a PR that adds a dependency with a known high/critical vulnerability or a licence we
# do not accept in core (CLAUDE.md §11: no AGPL; SSPL per docs/07 §14) fails.
name: dependency-review

on:
  pull_request:

permissions: {}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
