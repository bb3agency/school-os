# SchoolOS CI (docs/10 §7, docs/12 §9, docs/07 §14).
#
# Every job calls the same `make` target a developer runs locally (local == CI). The single
# required status check for branch protection is `ci-ok`, which fails if any job failed or
# was cancelled.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # deploy-staging.yml runs this whole workflow before it deploys (audit 2026-10-05 P2-08 b:
  # staging deploys only a commit whose CI passed, without workflow_run).
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a staging deploy's CI never waits on or
  # cancels the push CI run of the same commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every commit on main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOS_ENV: ci
  FORCE_COLOR: "1"
  PY_COLORS: "1"
  UV_NO_PROGRESS: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: make lint
        run: make lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: make typecheck
        run: make typecheck

  test:
    # test-api needs Docker (testcontainers: pgvector Postgres, Valkey, SeaweedFS); GitHub's
    # ubuntu runners provide it. test-api also enforces the coverage gate ([tool.coverage.report]
    # fail_under in pyproject.toml; docs/12 §9). test-web runs vitest.
    name: test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [test-api, test-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: make ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: make "$TARGET"

  e2e:
    # Playwright (docs/12 §2, §9): signed-out pages, and through the scripted stand-in IdP and
    # canned API (apps/web/e2e/support/stand-in.ts; synthetic data only) the signed-in school
    # and platform pages, the M1 journeys, Ask the school, axe (WCAG 2.2 AA), keyboard-only
    # paths and the responsive layout at 1366x768 and 375x812 in English and Telugu. Hermetic:
    # the only service is Valkey for the BFF session store. Sharded by spec file; the HTML
    # report and traces are uploaded when a shard fails.
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      valkey:
        image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_STAND_IN: "1"
      REDIS_URL: redis://localhost:6379/1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install Playwright Chromium (the version locked in package-lock.json)
        run: npm exec -w @schoolos/web -- playwright install --with-deps chromium
      - name: next build
        run: npm run build -w @schoolos/web
      - name: make e2e (one shard)
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: make e2e E2E_ARGS="--shard=${SHARD}"
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  edge-agent:
    # The Tally edge agent (apps/edge-agent; ADR-0032, Proposed): unit tests with synthetic Tally
    # XML and a fake SchoolOS, on Linux and on Windows (the PC it runs on; DPAPI is only tested
    # there). Windows runners have no make, so both run the same uv command.
    name: edge-agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - name: agent tests
        run: uv run --locked --package sos-edge-agent --group test pytest apps/edge-agent/tests -q

  migrations:
    # Alembic upgrade -> downgrade -> upgrade on a seeded synthetic DB + RLS catalog test
    # (docs/12 §4.5, CLAUDE.md §6 invariant 12).
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: make migration-check
        run: make migration-check

  authz-suite:
    # Route enumeration, authz matrix, BOLA, cross-tenant isolation (docs/12 §4.1-4.7).
    name: authz-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: make test-security
        run: make test-security

  security:
    # gitleaks (full history), semgrep (.semgrep + p/python p/typescript p/owasp-top-ten),
    # pip-audit, npm audit (production at high with no exceptions; full tree through
    # scripts/npm-audit-check.mjs), trivy fs + config. All via `make security`.
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # semgrep SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
      - uses: ./.github/actions/install-tools
        with:
          tools: gitleaks trivy
      - uses: ./.github/actions/setup-toolchain
      - name: make security
        env:
          SEMGREP_SEND_METRICS: "off"
        run: make security SEMGREP_ARGS=--sarif-output=semgrep.sarif
      - name: Upload semgrep SARIF (code scanning)
        # Pull requests from forks get a read-only token; the findings still fail `make security`.
        if: always() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  ci-config:
    # Lints the CI/governance config itself: custom semgrep rule tests, actionlint, zizmor.
    name: ci-config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - uses: ./.github/actions/install-tools
        with:
          tools: actionlint
      - name: semgrep rule tests
        env:
          SEMGREP_SEND_METRICS: "off"
        # Tools come from hash-pinned requirement files (Scorecard Pinned-Dependencies).
        run: uv run --no-project --with-requirements .github/tools/semgrep-requirements.txt semgrep --test --metrics=off .semgrep
      - name: actionlint
        run: actionlint -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        # Explicit --config: see .github/zizmor.yml for the one disabled audit and why.
        run: uv run --no-project --with-requirements .github/tools/zizmor-requirements.txt zizmor --format=github --config .github/zizmor.yml .

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tools
        with:
          tools: terraform tflint trivy
      - name: Find Terraform roots
        id: roots
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          dirs=$(find infra/terraform deploy/dedicated -name '*.tf' -not -path '*/.terraform/*' \
                   -exec dirname {} \; 2>/dev/null | sort -u | tr '\n' ' ' || true)
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          if [[ -z "${dirs// /}" ]]; then
            echo "::notice::No Terraform files found under infra/terraform or deploy/dedicated; skipping."
          else
            echo "Terraform directories: ${dirs}"
          fi
      - name: terraform fmt
        if: steps.roots.outputs.dirs != ''
        env:
          DIRS: ${{ steps.roots.outputs.dirs }}
        run: |
          rc=0
          for d in $DIRS; do terraform fmt -check -diff "$d" || rc=1; done
          exit "$rc"
      - name: terraform validate
        if: steps.roots.outputs.dirs != ''
        env:
          DIRS: ${{ steps.roots.outputs.dirs }}
        run: |
          for d in $DIRS; do
            echo "::group::validate $d"
            if [[ -f "$d/.terraform.lock.hcl" ]]; then
              # Root modules commit their lock file; CI must not change it.
              terraform -chdir="$d" init -backend=false -lockfile=readonly -no-color
            else
              terraform -chdir="$d" init -backend=false -no-color
            fi
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done
      - name: tflint
        if: steps.roots.outputs.dirs != ''
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when tflint --init fetches plugins
          DIRS: ${{ steps.roots.outputs.dirs }}
        run: |
          cfg=()
          for c in .tflint.hcl infra/terraform/.tflint.hcl; do
            if [[ -f "$c" ]]; then cfg=(--config "$PWD/$c"); break; fi
          done
          for d in $DIRS; do
            echo "::group::tflint $d"
            tflint --chdir="$d" "${cfg[@]}" --init
            tflint --chdir="$d" "${cfg[@]}" --format compact
            echo "::endgroup::"
          done
      - name: trivy config (IaC misconfiguration)
        run: |
          targets=()
          for t in infra deploy; do [[ -d "$t" ]] && targets+=("$t"); done
          if [[ ${#targets[@]} -eq 0 ]]; then echo "nothing to scan"; exit 0; fi
          for t in "${targets[@]}"; do
            trivy config --exit-code 1 --severity HIGH,CRITICAL --quiet "$t"
          done

  images:
    # Build each image, generate an SPDX SBOM (syft) and scan it (trivy); nothing is pushed.
    # docs/10 §6: images must have no unwaived HIGH/CRITICAL (fixable) CVEs before push.
    name: images (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: api
          - image: worker
            dockerfile: apps/api/Dockerfile  # worker + beat: api image + headless Chromium (pdf queue)
            target: worker
          - image: web
            dockerfile: apps/web/Dockerfile
            target: ""
    env:
      IMAGE: schoolos-${{ matrix.image }}:${{ github.sha }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tools
        with:
          tools: syft trivy
      - name: docker build
        run: |
          if [[ ! -f "$DOCKERFILE" ]]; then
            echo "::error file=${DOCKERFILE}::Dockerfile not found (expected ${DOCKERFILE}, build context = repo root)"
            exit 1
          fi
          docker build --pull -f "$DOCKERFILE" ${TARGET:+--target "$TARGET"} -t "$IMAGE" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            .
      - name: PDF render smoke (worker image, FR-EXP-002)
        if: matrix.image == 'worker'
        # Renders a synthetic Telugu page with the baked Chromium as UID 10001 on a read-only root,
        # all capabilities dropped, no network. Unsandboxed only here: Docker's default seccomp
        # profile blocks the sandbox (ADR-0025); staging/prod keep it required.
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=256m,uid=10001,gid=10001 --cap-drop ALL \
            --security-opt no-new-privileges:true --network none -e SOS_ENV=ci \
            -v "$PWD/infra/docker/worker-pdf-smoke.py:/smoke/worker-pdf-smoke.py:ro" \
            --entrypoint python "$IMAGE" /smoke/worker-pdf-smoke.py
      - name: Sandboxed PDF render (worker image, ADR-0025, FR-EXP-002)
        if: matrix.image == 'worker'
        # The same render with the Chromium sandbox ON, as on dedicated hosts and the shared tier's
        # pdf capacity: must fail under Docker's default seccomp profile and succeed under
        # deploy/dedicated/security/seccomp-worker.json + the schoolos-worker AppArmor profile.
        # The runner is Ubuntu 24.04 like a dedicated host; userns is restricted explicitly so the
        # AppArmor profile's `userns,` rule is really exercised.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apparmor_parser --replace deploy/dedicated/security/apparmor-schoolos-worker
          bash infra/docker/worker-pdf-sandbox-check.sh "$IMAGE" --apparmor schoolos-worker
      - name: SBOM (syft, SPDX JSON)
        env:
          NAME: ${{ matrix.image }}
        run: syft scan "docker:${IMAGE}" -o "spdx-json=sbom-${NAME}.spdx.json" -q
      - name: trivy image scan
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --quiet "$IMAGE"
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 30
          if-no-files-found: error

  ci-ok:
    # The only check to mark as required in branch protection / rulesets.
    name: ci-ok
    if: always()
    needs: [lint, typecheck, test, e2e, edge-agent, migrations, authz-suite, security, ci-config, terraform, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [[ -n "$bad" ]]; then
            echo "::error::CI jobs not successful: $bad"
            exit 1
          fi
