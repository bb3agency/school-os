# Weekly dependency updates (docs/07 §14, docs/13 §9). Minor and patch updates are grouped
# per ecosystem; majors come as individual PRs. A 7-day cooldown avoids adopting freshly
# published (possibly compromised) releases; security updates are not delayed by it.
# Note: tool binaries pinned in .github/actions/install-tools (version + sha256) are updated by hand.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/worker
      - /apps/web
      - /deploy/dedicated
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/dedicated
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/*
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    labels: [dependencies, infra]
    commit-message:
      prefix: "chore(infra)"
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
