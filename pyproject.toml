[project]
name = "schoolos"
version = "0.1.0"
description = "SchoolOS monorepo (uv workspace root; not a package)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false
required-version = "==0.12.19"
# Supply-chain cooldown (semgrep uv-missing-dependency-cooldown, SEC-009): resolve only releases at
# least 7 days old, like the Dependabot cooldown. Security fixes newer than that need an explicit
# exclude-newer-package override with a reason.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "evals", "apps/edge-agent"]

[tool.uv.sources]
sos-api = { workspace = true }
sos-worker = { workspace = true }
sos-evals = { workspace = true }
sos-edge-agent = { workspace = true }

[dependency-groups]
dev = [
  "ruff==0.16.9",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "hypothesis==6.168.1",
  "factory-boy==3.3.3",
  "testcontainers[postgres]==4.15.0",
  "import-linter==2.15",
  "pip-audit==2.10.1",
  "types-pyyaml==6.0.12.20260906",
  "types-openpyxl==3.1.5.20260827",
  "boto3-stubs[s3,kms]==1.43.103",
  "celery-types==0.26.0",
  "pre-commit==4.6.2",
  # Test-order check (docs/12 §9): shuffles only when asked (`--random-order-bucket=...`), so the
  # default run is unchanged; unlike pytest-randomly it does not reseed `random` per test.
  # Licence MIT; only dependency pytest; no known vulnerabilities (PyPI/OSV, 2026-09-27).
  "pytest-random-order==1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "node_modules", ".semgrep", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "PT", "T20", "DTZ", "ASYNC", "PL"]
# N818: domain exception names are fixed by docs/13 §4 (NotFound, Forbidden, ...).
ignore = ["PLR0913", "PLR2004", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["app", "sos_worker", "sos_evals", "sos_edge_agent"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S311", "S101", "S105", "S106", "S603", "S607", "S608", "PLR2004", "PLC0415", "N802"]
"apps/api/migrations/**" = ["E501"]
# Developer CLIs: they print to the terminal and start local processes (fixed argv lists).
"scripts/**" = ["T201", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api", "apps/worker", "evals", "apps/edge-agent"]
explicit_package_bases = true
exclude = ["apps/web/", "node_modules/"]

[[tool.mypy.overrides]]
# testcontainers and rfc8785 ship without complete type information
module = ["testcontainers.*", "rfc8785", "factory.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pypdfium2 ships without type information (ADR-0027; used only by app/knowledge/ingestion/pdf.py)
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests", "evals/tests", "apps/edge-agent/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
timeout = 300
markers = [
  "db: needs a PostgreSQL test database (testcontainers or SOS_TEST_DATABASE_URL)",
  "redis: needs Valkey/Redis",
  "s3: needs an S3-compatible endpoint",
  "recall_sweep: heavy authorised-recall sweep (docs/06 §6); runs only with SOS_RECALL_SWEEP=1",
]

[tool.coverage.run]
branch = true
source = ["apps/api/app", "apps/worker/sos_worker"]

[tool.coverage.report]
# Merge gate (docs/12 §9): combined line + branch coverage of the full `make test-api` run.
# Measured 2026-09-27: 92.97 % (lines 94.92 %, branches 84.58 %; PDF render tests skipped).
# Set a little below the measurement for machine differences; raise it as coverage grows
# (plan in docs/12 §9). Only the full run is gated: `pytest --cov` on a subset will fail it.
fail_under = 92
