[project]
name = "sos-api"
version = "0.1.0"
description = "SchoolOS API (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.1",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "pyjwt[crypto]==2.15.0",
  "cryptography==50.0.1",
  "boto3==1.43.103",
  "uuid-utils==1.0.0",
  "rfc8785==0.1.4",
  "pyyaml==6.0.3",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "filetype==1.2.0",
  "rapidfuzz==3.14.6",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "opentelemetry-instrumentation-fastapi==0.66b0",
  "opentelemetry-instrumentation-sqlalchemy==0.66b0",
  "opentelemetry-instrumentation-httpx==0.66b0",
  "opentelemetry-instrumentation-celery==0.66b0",
  "opentelemetry-instrumentation-redis==0.66b0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
