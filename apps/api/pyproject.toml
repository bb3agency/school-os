[project]
name = "sos-api"
version = "0.1.0"
description = "SchoolOS API (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.1",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "pyjwt[crypto]==2.15.0",
  "cryptography==50.0.1",
  "boto3==1.43.103",
  "uuid-utils==1.0.0",
  "rfc8785==0.1.4",
  "pyyaml==6.0.3",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "filetype==1.2.0",
  "rapidfuzz==3.14.6",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "opentelemetry-instrumentation-fastapi==0.66b0",
  "opentelemetry-instrumentation-sqlalchemy==0.66b0",
  "opentelemetry-instrumentation-httpx==0.66b0",
  "opentelemetry-instrumentation-celery==0.66b0",
  "opentelemetry-instrumentation-redis==0.66b0",
  "playwright==1.56.0",
  # Image redaction of register photos (PRV-016, ADR-0007): decode, black out, re-encode without
  # metadata. Licence MIT-CMU (HPND); no known vulnerabilities for 12.3.0 (PyPI/pip-audit).
  "pillow==12.3.0",
  # Anthropic Messages API client, imported ONLY under app/knowledge/gateway (ADR-0005, CLAUDE.md
  # §11; semgrep sos-llm-sdk-outside-gateway). Licence MIT; runtime deps anyio, distro (Apache-2.0),
  # docstring-parser, httpx (already pinned), jiter, pydantic, sniffio, typing-extensions: no AGPL;
  # no known vulnerabilities (OSV, 2026-09-27). 0.125.0 is the last 0.x release (2026-08-19) and
  # has every API feature the gateway uses (search_result blocks, thinking disabled,
  # output_config). 1.x (1.8.0 current) moves to httpx2, and installing httpx2 silently switches
  # Starlette's TestClient from httpx to httpx2 across every test module; that migration is a
  # separate, repo-wide change (CLAUDE.md §3 lists httpx), so it is deferred, not smuggled in here.
  "anthropic==0.125.0",
  # Google OAuth credentials for Gemini on Vertex AI (ADR-0033), imported ONLY under
  # app/knowledge/gateway (semgrep sos-llm-sdk-outside-gateway). Only token minting is used: the
  # service-account JWT flow and AWS -> Google workload identity federation; the Vertex REST calls
  # themselves go through httpx (already pinned) with an httpx transport adapter, so neither
  # `requests` nor the google-genai SDK is needed. Licence Apache-2.0; runtime deps pyasn1-modules
  # (BSD-2-Clause) and cryptography (already pinned); maintained by Google (2.59.0 released
  # 2026-09); no known vulnerabilities (pip-audit / OSV, 2026-09-30). google-genai (Apache-2.0) was
  # not chosen: it pulls requests, websockets, aiohttp-style extras and tenacity, and its own retry
  # and logging would bypass the gateway's retry, breaker and no-text-in-logs controls.
  "google-auth==2.59.0",
  # PDF text layer for knowledge ingestion (ADR-0027, FR-KB-001), imported ONLY by
  # app/knowledge/ingestion/pdf.py inside the ingest worker. Licence Apache-2.0 / BSD-3-Clause;
  # bundles a PDFium binary (BSD-3-Clause) per platform wheel (manylinux/musllinux, win_amd64);
  # no runtime Python dependencies; no known vulnerabilities (PyPI + OSV, 2026-09-27); 5.13.0 is
  # the current release (2026-08-13, roughly monthly releases). trivy/pip-audit cover the wheel.
  "pypdfium2==5.13.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
