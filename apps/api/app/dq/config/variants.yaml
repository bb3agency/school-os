# Never equivalent: gender markers and different name forms. A tenant extension that would put
# both members of a pair in one group is rejected, and the matcher never accepts one as a typo
# or phonetic variant of the other.
distinct:
  - [KUMAR, KUMARI]
  - [KRISHNA, KRISHNAN]
  - [NARAYANA, NARAYANAN]
  - [SRINIVASA, SRINIVASAN]
  - [VENKATESH, VENKATESAN]
  - [SRINIVASA, SRINIVASULU]
  - [VENKATESWARA, VENKATESWARLU]
  - [NARASIMHA, NARASIMHULU]
