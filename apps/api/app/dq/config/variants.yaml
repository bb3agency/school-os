# Name variant dictionary (docs/02 §6 step 4, FR-DQ-003). Dataset version 1.
#
# Each group lists spellings of ONE name token that school records use interchangeably in
# Andhra Pradesh. The first member is the group's representative. Matching looks tokens up by
# their phonetic key (app.core.textnorm.phonetic_key), so spellings that already share a
# phonetic key (SEETHA/SITA, SHIVA/SIVA, VENKATTA/VENKATA) would match without an entry. Such
# groups are still listed where people expect them (SRI/SREE/SHRI, SAI/SAAI, SEKHAR/SHEKAR) so
# the file documents the known equivalences; a test requires at least 60 groups that join two
# or more different phonetic keys, i.e. groups the phonetic key alone would not catch.
#
# Written from common spellings seen in registers, certificates and Aadhaar letters. No entry
# comes from a real record. Tenants can add groups (VariantDictionary.merged); groups that share
# a spelling are joined. Pairs under `distinct` are never joined, not even through a tenant
# extension, and are never accepted as a typo of each other: they mark gender or a different
# name form, which boards treat as a different name.
#
# Group ids are stable identifiers (lowercase ascii); members are upper-case Latin tokens.
version: 1

groups:
  # --- honorific / devotional prefixes and "Sri" compounds ----------------------------------
  - id: sri                 # Sri, Sree, Shri, Shree ("Sri Lakshmi", "Sree Vani")
    members: [SRI, SREE, SHRI, SHREE, SHRII]
  - id: srilakshmi          # compound written as one word
    members: [SRILAKSHMI, SREELAKSHMI, SRILAXMI, SREELAXMI, SHRILAKSHMI]
  - id: sridevi
    members: [SRIDEVI, SREEDEVI, SHRIDEVI]
