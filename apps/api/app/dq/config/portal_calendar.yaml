        - https://www.careerindia.com/news/cisce-icse-isc-2027-2028-registration-begins-check-dates-063637.html
      verified: false

    # For March 2026 the board took the nominal roll from UDISE+ with a three-day correction
    # window; the next one is expected in February 2027 (docs/18 §1.3).
    - key: bseap_ssc_2027_nominal_roll
