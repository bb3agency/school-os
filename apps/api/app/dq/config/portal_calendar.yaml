# Portal and board calendar: the windows in which schools submit or correct data on government
# and board portals (FR-RDY-001, US-3101, ADR-0053). Loaded and validated by
# app.dq.calendar.load_calendar() when the API starts.
#
# Owner decision D3 (2026-10-10) and lead decision D45 (2026-10-21): every date below is an
# EXPECTATION built from public, mostly secondary sources (listed per event) and the dates of
# earlier years. None of them is official and none is verified (`verified: false`). Schools see
# them as "Expected around ..." until a person at the school confirms the real dates
# (ops.portal_calendar_dates); a confirmed date always wins over this file.
#
# A release per academic year refreshes this file from circulars and pilot schools' confirmations.
# Dates move every year and differ by state; do not tighten an `approximate` date without a
# source that says so.
#
# Per event:
#   key           unique in the whole file, ^[a-z][a-z0-9_]{2,63}$ (stored on tasks and reminders)
#   portal        udise_plus | bseap | cbse | cisce | apaar (the notification names the portal)
#   label_en/te   what the school calls the window (te shown only with SOS_TELUGU_ENABLED)
#   profile_keys  readiness or pre-check profiles it concerns (app/dq/config/profiles); the
#                 reminder carries the readiness counts of those that have a readiness check
#   boards        the boards it applies to (empty: every school, a portal such as UDISE+)
#   classes       the classes it applies to (empty: every class)
#   opens_on, closes_on (YYYY-MM-DD) with opens_approximate / closes_approximate
#   lead_days     reminders this many days before the window closes (default below)
#   source        public pages the expectation came from
#   verified      false until an official document confirms the dates (D3)
version: 1
default_lead_days: [30, 14, 7, 1]

portals:
  udise_plus: {en: "UDISE+", te: "UDISE+"}
  bseap: {en: "AP SSC board (BSEAP)", te: "AP SSC బోర్డు (BSEAP)"}
  cbse: {en: "CBSE", te: "CBSE"}
  cisce: {en: "CISCE", te: "CISCE"}
  apaar: {en: "APAAR", te: "APAAR"}

years:
  # Academic year 2026-27 (the school's academic year starting in 2026).
  "2026-27":
    - key: udise_plus_2026_freeze
      portal: udise_plus
      label_en: UDISE+ 2026-27 student data closes (freeze)
      label_te: UDISE+ 2026-27 విద్యార్థి వివరాల గడువు (ఫ్రీజ్)
      profile_keys: [udise-plus, apaar]
      boards: []
      classes: []
      opens_on: 2026-09-01
      opens_approximate: true
      closes_on: 2026-11-30
      closes_approximate: true
      source:
        - https://educationforallinindia.com/udise-2026-27-answers-to-the-questions-parents-teachers-and-school-heads-are-actually-asking/
        - https://circin.ai/blog/udise-plus-2026-27-deadline-apaar-guide
      verified: false

    - key: apaar_2026_generation_drive
      portal: apaar
      label_en: APAAR ID generation drive 2026-27
      label_te: APAAR ID తయారీ కార్యక్రమం 2026-27
      profile_keys: [apaar]
      boards: []
      classes: []
      opens_on: 2026-07-01
      opens_approximate: true
      closes_on: 2026-12-31
      closes_approximate: true
      source:
        - https://apaar.education.gov.in/
        - https://circin.ai/blog/udise-plus-2026-27-deadline-apaar-guide
      verified: false

    - key: cbse_registration_2027
      portal: cbse
      label_en: CBSE registration, Class IX and XI (2026-27)
      label_te: CBSE నమోదు, IX మరియు XI తరగతులు (2026-27)
      profile_keys: [cbse-registration-2027]
      boards: [CBSE]
      classes: [IX, XI]
      opens_on: 2026-09-01
      opens_approximate: true
      closes_on: 2026-10-31
      closes_approximate: true
      source:
        - https://www.cbse.gov.in/cbsenew/cbse.html
        - https://news.careers360.com/cbse-board-exams-apaar-id-class-9-11-loc-registration-2026-27-two-level-10-maths-social-science-2028/amp
      verified: false

    - key: cbse_loc_2027
