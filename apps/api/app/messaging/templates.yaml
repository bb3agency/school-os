# WhatsApp message catalogue (ADR-0043 decision 3, ADR-0044 decisions 5-6; FR-MSG-005,
# FR-LANG-004, FR-LANG-005; PRV-026). Versioned configuration shipped inside the package, read by
# app/messaging/catalogue.py.
#
# templates   Business-initiated messages. Category UTILITY only: marketing templates are never
#             created (a test refuses any other category; admissions, events for sale, camps and
#             anything promotional do not belong here). Each template is created in every
#             school's WABA per language under the name sos_<key>_v<version>_<lang>. Bodies use
#             Meta's positional variables {{1}}, {{2}}, ... in the order of `variables` (a
#             body may not start or end with a variable). Variables carry only what the purpose
#             needs (PRV-026): never marks, attendance history, health, caste, Aadhaar data or
#             another child's data.
#   optin_category  the opt-in category a guardian needs for this purpose (none: sent as the
#                   reply to the parent's own join message, inside the service window).
#   buttons   url: a dynamic URL button whose suffix is the parent link token (ADR-0046),
#             <SOS_PUBLIC_BASE_URL>/p/{{1}}. No opt-out button and no "reply STOP" text (owner
#             decision D32, 2026-10-18: utility messages only); an inbound STOP is still honoured
#             (FR-MSG-010). Version 2 dropped the version 1 "Stop messages" quick reply.
#   reviewed  false until a fluent reviewer signs the language off (ADR-0044 decision 6; owner
#             decision D23). Meta's approval of a Telugu template does not count as review.
# texts       Free-form replies sent only inside the 24-hour window the parent opened by writing
#             (no template, no charge): the STOP confirmation and the one automatic reply a day.
#             Named placeholders {school_name} / {office_phone}.
# slip        The printed join slip (parent-facing, in the parent language; ADR-0044 decision 2).
version: 1

templates:
  optin_confirm:
    version: 2
    purpose: optin_confirm
    category: utility
    optin_category: null
    variables:
      - {name: school_name, max_length: 60}
    buttons: []
    en:
      reviewed: true
      body: "You will now get WhatsApp messages from {{1}} about your child."
    te:
      reviewed: false
      body: "మీ పిల్లల గురించి {{1}} నుండి ఇకపై మీకు WhatsApp సందేశాలు వస్తాయి."

  school_notice:
    version: 2
    purpose: school_notice
    category: utility
    optin_category: notices
    variables:
      - {name: school_name, max_length: 60}
      - {name: notice_title, max_length: 120}
    buttons: [url]
    en:
      reviewed: true
      body: "New notice from {{1}}: {{2}}. Tap the button below to read the full notice."
      url_label: Read notice
    te:
      reviewed: false
      body: "కొత్త నోటీసు ({{1}}): {{2}}. పూర్తి నోటీసు చదవడానికి కింద ఉన్న బటన్ నొక్కండి."
      url_label: నోటీసు చదవండి

  absence_alert:
    version: 2
    purpose: absence_alert
    category: utility
    optin_category: attendance
    variables:
      - {name: school_name, max_length: 60}
      - {name: child_first_name, max_length: 40}
      - {name: date, max_length: 20}
    buttons: []
    en:
      reviewed: true
      body: "Attendance update from {{1}}: {{2}} was marked absent on {{3}} at the time of this message. Please contact the school office if this is not right."
    te:
      reviewed: false
      body: "హాజరు సమాచారం ({{1}}): ఈ సందేశం పంపిన సమయానికి {{2}} ను {{3}} తేదీన గైర్హాజరుగా నమోదు చేశారు. ఇది సరికాకపోతే దయచేసి పాఠశాల కార్యాలయాన్ని సంప్రదించండి."

  fee_reminder:
    version: 2
    purpose: fee_reminder
    category: utility
    optin_category: fees
    variables:
      - {name: school_name, max_length: 60}
      - {name: amount, max_length: 16}
      - {name: child_first_name, max_length: 40}
      - {name: due_date, max_length: 20}
    buttons: [url]
    en:
      reviewed: true
      body: "Fee reminder from {{1}}: ₹{{2}} for {{3}} is due on {{4}}. Tap the button below to see the details."
      url_label: See details
    te:
      reviewed: false
      body: "ఫీజు గుర్తు ({{1}}): {{3}} కోసం ₹{{2}} చెల్లించడానికి గడువు {{4}}. వివరాలు చూడటానికి కింద ఉన్న బటన్ నొక్కండి."
      url_label: వివరాలు చూడండి

  fee_receipt:
    version: 2
    purpose: fee_receipt
    category: utility
    optin_category: fees
    variables:
      - {name: school_name, max_length: 60}
      - {name: amount, max_length: 16}
      - {name: child_first_name, max_length: 40}
      - {name: receipt_number, max_length: 30}
      - {name: date, max_length: 20}
    buttons: [url]
    en:
      reviewed: true
      body: "Payment received by {{1}}: ₹{{2}} for {{3}}, receipt {{4}} dated {{5}}. Tap the button below to see the receipt."
      url_label: See receipt
    te:
      reviewed: false
      body: "చెల్లింపు అందింది ({{1}}): {{3}} కోసం ₹{{2}}, రసీదు {{4}}, తేదీ {{5}}. రసీదు చూడటానికి కింద ఉన్న బటన్ నొక్కండి."
      url_label: రసీదు చూడండి

texts:
  optin_stopped:
    en:
      reviewed: true
      body: "You will not get WhatsApp messages from {school_name} any more. To join again, ask the school office for a new slip."
    te:
      reviewed: false
      body: "{school_name} నుండి మీకు ఇకపై WhatsApp సందేశాలు రావు. మళ్ళీ చేరాలంటే కొత్త స్లిప్ కోసం పాఠశాల కార్యాలయాన్ని అడగండి."
  auto_reply:
    en:
      reviewed: true
      body: "This number sends school messages only and nobody reads replies here. For questions, please call the school office at {office_phone}."
    te:
      reviewed: false
      body: "ఈ నంబర్ నుండి పాఠశాల సందేశాలు మాత్రమే వస్తాయి; ఇక్కడ పంపిన జవాబులను ఎవరూ చదవరు. ప్రశ్నల కోసం దయచేసి పాఠశాల కార్యాలయానికి {office_phone} నంబర్‌కు ఫోన్ చేయండి."
  auto_reply_no_phone:
    en:
      reviewed: true
      body: "This number sends school messages only and nobody reads replies here. For questions, please contact the school office."
    te:
      reviewed: false
      body: "ఈ నంబర్ నుండి పాఠశాల సందేశాలు మాత్రమే వస్తాయి; ఇక్కడ పంపిన జవాబులను ఎవరూ చదవరు. ప్రశ్నల కోసం దయచేసి పాఠశాల కార్యాలయాన్ని సంప్రదించండి."

slip:
  en:
    reviewed: true
    title: Get school messages on WhatsApp
    for_parents_of: For the parents of
    categories_intro: "You will get messages about:"
    category_notices: School notices
    category_attendance: Attendance (if your child is absent)
    category_fees: Fees (reminders and receipts)
    step_scan: Scan the code with your phone camera, or open this link
    step_send: "Send this message from your own WhatsApp number:"
    voluntary: Joining is your choice. Your child's place at school does not depend on it.
    valid_until: Code valid until
    footer: The school sends these messages from its own WhatsApp number through SchoolOS.
  te:
    reviewed: false
    title: పాఠశాల సందేశాలను WhatsApp లో పొందండి
    for_parents_of: వీరి తల్లిదండ్రుల కోసం
    categories_intro: "మీకు వీటి గురించి సందేశాలు వస్తాయి:"
    category_notices: పాఠశాల నోటీసులు
    category_attendance: హాజరు (మీ పిల్లలు గైర్హాజరైతే)
    category_fees: ఫీజులు (గుర్తులు, రసీదులు)
    step_scan: మీ ఫోన్ కెమెరాతో కోడ్‌ను స్కాన్ చేయండి, లేదా ఈ లింక్ తెరవండి
    step_send: "మీ సొంత WhatsApp నంబర్ నుండి ఈ సందేశం పంపండి:"
