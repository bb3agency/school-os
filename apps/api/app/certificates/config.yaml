  identification_marks: {en: "Personal marks of identification", te: "గుర్తింపు చిహ్నాలు"}
  first_language_and_subjects: {en: "First language and subjects studied", te: "ప్రథమ భాష, చదివిన విషయాలు"}
  fees_paid_up_to: {en: "Month up to which fees were paid", te: "ఫీజు చెల్లించిన నెల"}
