  dob_in_words: {en: "Date of birth (in words)", te: "పుట్టిన తేదీ (అక్షరాల్లో)"}
  leaving_date: {en: "Date of leaving the school", te: "పాఠశాల విడిచిన తేదీ"}
  leaving_reason: {en: "Reason for leaving", te: "విడిచిపెట్టడానికి కారణం"}
  promotion: {en: "Whether qualified for promotion to a higher class", te: "పై తరగతికి అర్హులా"}
