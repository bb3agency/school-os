# Exports configuration (FR-EXP-001..004, US-501 AC4, US-901; docs/05 §13 retention).
# Versioned configuration shipped inside the package (the API image does not copy /config).
# Loaded and validated by app.exports.config.load_config(); change `version` (and the profile's
# `layout_version`) whenever the produced files change shape, so audit events and export rows
# say which layout a file used.
version: 1

# Files are deleted this many days after an export is ready (docs/05 §13: "Exports 7 days,
# regenerate on demand"); the row stays as the record of who exported what.
retention_days: 7
# One export covers at most this many students (NFR-PERF-005 sizes: one school's batch).
max_students: 2000
# Findings listed in one pre-check report (most severe first).
max_findings: 20000
# Presigned download URLs live at most 5 minutes (FR-DOC-004).
download_url_ttl_s: 300

# US-901 AC2 / FR-EXP-003: every file carries this watermark (both languages).
watermark:
  en: Generated by SchoolOS for internal checking
  te: అంతర్గత తనిఖీ కోసం SchoolOS రూపొందించింది

# PDF rendering (timeout, Chromium sandbox) is configured once for every caller in
# app/core/pdf.yaml (renderer app/core/pdf.py; ADR-0025).

# Attributes that never leave SchoolOS in any export, in clear or masked (PRV-013..014: the
# Aadhaar-as-printed fields exist only to detect mismatches).
never_exported: [aadhaar_name_as_printed, aadhaar_dob_as_printed, aadhaar_gender_as_printed]
# The only way an Aadhaar reference is ever shown (PRV-014).
aadhaar_last4_display: "XXXX XXXX {last4}"

# Pre-check layouts, keyed by the DQ profile (app/dq/config/profiles). `fields` is the target
# field order of the "ready to enter" sheet (US-501 AC4); every required field of the DQ
# profile must be listed. `kind` decides the permission: board -> export.board,
# portal -> export.portal (docs/07 §6.2).
# TODO(board formats): align field order, date format and codes with the council's and the
# portal's templates before the pilot (same note as the DQ profiles).
profiles:
  cisce-registration-2026:
    kind: board
    layout_version: 1
    date_format: "%d/%m/%Y"
    fields: [admission_no, full_name, gender, dob, father_name, mother_name]
    value_maps:
      gender: {female: F, male: M, transgender: T}
  # layout_version 2 (ADR-0037, FR-EXP-005): UDISE+ PEN and APAAR ID columns, empty when
  # unknown. The typed APAAR ID is written unmasked; every other cell keeps the Aadhaar mask.
  # layout_version 3 (ADR-0039, FR-EXP-006): the 2026-27 Student Module order (general profile,
  # then enrolment profile, then identifiers) for every field SchoolOS holds; the profile's
  # portal_fields list the rest. From public sources, verified: false (owner decision D3).
  # religion and disability are restricted (C3): masked unless the export includes them.
  udise-plus:
    kind: portal
    layout_version: 3
    date_format: "%d/%m/%Y"
    fields: [full_name, gender, dob, mother_name, father_name, mother_tongue, category,
             religion, disability, nationality, admission_no, admission_date, udise_pen,
             apaar_id]
    value_maps:
      gender: {female: Female, male: Male, transgender: Transgender}
      category: {general: General, ews: EWS, obc: OBC, sc: SC, st: ST}

# Generic student list (student.export, step-up): any attribute of the catalog except
# `never_exported`, plus these structure columns. Restricted (C3) attributes need
# student.read_sensitive and are listed in the audit event.
student_list:
  layout_version: 1
  date_format: "%d/%m/%Y"
  structure_columns: [class, section, roll_no]

