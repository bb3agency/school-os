  aadhaar_as_printed: {en: Aadhaar (as printed), te: ఆధార్ (ముద్రించినట్లు)}
  udise_plus: {en: UDISE+, te: UDISE+}
  board_registration: {en: Board registration, te: బోర్డు నమోదు}
