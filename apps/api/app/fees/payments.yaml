# Online payments through the school's own Razorpay account (R2-2D; ADR-0042 decisions 2, 3,
# 6-10; docs/03 §3.21 FR-PAY-*). Versioned configuration shipped inside the package (invariant
# 13), read by app/fees/payments_config.py. Provider URLs, limits, lifetimes and timings live
# here, never inline.
version: 1

razorpay:
  # Only these hosts are ever called (egress allowlist, docs/10 §11.2; FR-PAY-001).
  api_base_url: https://api.razorpay.com
  auth_base_url: https://auth.razorpay.com
  timeout_s: 10
  # Events the webhook subscribes to (FR-PAY-004); a manual-keys school ticks the same list.
  webhook_events:
    - payment_link.paid
    - payment_link.expired
    - payment_link.cancelled
    - payment.captured
    - payment.failed
    - refund.processed
    - refund.failed
    - settlement.processed
    - account.app.authorization_revoked
  # OAuth (Technology Partner, ADR-0042 decision 6): scope and the lifetimes Razorpay documents.
  oauth_scope: read_write
  access_token_days: 90
  refresh_token_days: 180

links:
  # FR-PAY-005: expiry default 7 days, at least 15 minutes and at most six months ahead.
  default_expiry_days: 7
  min_expiry_minutes: 15
  max_expiry_days: 180
  # What Razorpay sees (ADR-0042 decision 8): no names, phones or emails.
  description: "School fees · {school} · {code}"
  school_name_max_length: 40
  # Open links one account may have at a time.
  max_open_per_account: 10

webhook:
  # Per-school random secret (FR-PAY-004) and how long the previous one keeps verifying
  # retries after a rotation (FR-PAY-014).
  secret_bytes: 32
  previous_secret_days: 7
  # Razorpay's event ids look like "evt_..."; anything else is refused as malformed.
  event_id_pattern: "^[A-Za-z0-9_:.-]{1,100}$"

inbox:
  # Events applied per worker pass, attempts before an event is marked failed, and the wait
  # before each retry (seconds; the last value repeats).
  batch_size: 50
  max_attempts: 8
  retry_backoff_s: [30, 120, 600, 1800, 3600, 7200, 14400]
  # Processed events are deleted this many days after processing (docs/05 §13).
  retention_days: 90

oauth:
  state_ttl_s: 600
  # FR-PAY-012: refresh this many days before the access token expires; alert the owner this
  # many days before the refresh token expires.
  refresh_before_days: 14
  alert_before_refresh_expiry_days: 14

reconciliation:
  # FR-PAY-010: previous IST day, 06:00 IST; settlements missing after 3 working days.
  settlement_after_working_days: 3
  page_size: 100
  max_pages: 50
  list_max: 200
