# Control-plane business rules (docs/16 §9-12, §15). Versioned config, no secrets.
# Supplier identity (legal name, GSTIN, state code) comes from settings (SOS_BILLING_SUPPLIER_*).
version: 1
billing:
  payment_terms_days: 15        # due date = issue date + terms
  grace_days: 15                # suspension possible only after grace, and never automatic
  default_gst_rate: "18.00"
  default_sac_code: "998314"    # confirm with a CA before the first real invoice (docs/16 Q3)
  invoice_prefix: "SOS"
  # SOS/26-27/000123 = 16 characters (CGST Rule 46; docs/16 Q2)
  invoice_number_format: "{prefix}/{fy_short}/{seq:06d}"
  usd_inr_rate: "84.00"         # reviewed monthly
  usage_thresholds: [80, 100]
  # Suspension inside a window needs a platform_owner (docs/16 §9.3).
  # Items: {name, boards: [BOARD, ...] ([] = every board), start: YYYY-MM-DD, end: YYYY-MM-DD}
  protected_windows: []
# Invoice PDFs (docs/16 §5.8; app/platform/invoice_pdf.py renders, invoice_files.py stores).
# Template v0 is PENDING CA REVIEW (docs/16 §19 Q2, Q3, Q11): bump template_version whenever the
# layout or wording changes; each stored PDF records the version it used. English only (a tax
# document for the school's accounts office, docs/16 §5.8). No student data, ever.
invoice_pdf:
  template_version: v0
  language: en
  title: Tax Invoice
  # Objects live under this prefix of the control-plane bucket (SOS_PLATFORM_INVOICE_BUCKET, or
  # the files bucket when unset), never under a school prefix t/<tenant_id>/ (ADR-0017).
  object_prefix: platform/invoices/
  download_url_ttl_s: 300       # presigned GET, at most 5 minutes (FR-DOC-004 rule)
  render_batch: 20              # invoices per sweep run (beat, queue "pdf")
  reverse_charge: "No"          # CGST Rule 46(p): tax payable on reverse charge
  # Printed when every line carries GST 0 (docs/16 §19 Q3: until registered). Wording for the CA.
  zero_tax_note: >-
    GST not charged on this invoice. Wording to be confirmed by the supplier's chartered
    accountant before use.
  footer_note: This is a computer-generated invoice.
  # GST state codes (place of supply shows "<code> - <name>").
  state_names:
    "01": Jammu and Kashmir
    "02": Himachal Pradesh
    "03": Punjab
    "04": Chandigarh
    "05": Uttarakhand
    "06": Haryana
    "07": Delhi
    "08": Rajasthan
    "09": Uttar Pradesh
    "10": Bihar
    "11": Sikkim
    "12": Arunachal Pradesh
    "13": Nagaland
    "14": Manipur
    "15": Mizoram
    "16": Tripura
    "17": Meghalaya
    "18": Assam
    "19": West Bengal
    "20": Jharkhand
    "21": Odisha
    "22": Chhattisgarh
    "23": Madhya Pradesh
    "24": Gujarat
    "26": Dadra and Nagar Haveli and Daman and Diu
    "27": Maharashtra
    "29": Karnataka
    "30": Goa
    "31": Lakshadweep
    "32": Kerala
    "33": Tamil Nadu
    "34": Puducherry
    "35": Andaman and Nicobar Islands
    "36": Telangana
    "37": Andhra Pradesh
    "38": Ladakh
    "97": Other Territory
fleet:
  heartbeat_interval_seconds: 300
  unreachable_after_minutes: 20
  key_rotation_overlap_days: 7
  max_heartbeat_bytes: 16384
  skew_seconds: 300
  nonce_ttl_seconds: 600
  rate_limit_seconds: 55
  min_supported_version: "0.0.0"
  degraded_rules:
    backup_max_age_hours: 26
    wal_lag_max_seconds: 900
    disk_used_max_pct: 85
    cert_min_days: 14
support:
  # SLA targets in hours (P3/P4 school days approximated as calendar hours in M0).
  sla_hours:
    p1: {first_response: 1, resolution: 8}
    p2: {first_response: 4, resolution: 48}
    p3: {first_response: 24, resolution: 120}
    p4: {first_response: 48, resolution: 720}
  retention_days_after_close: 365
# School-chain copies of platform actions (platform.tenant_audit_outbox; ADR-0020, docs/16 §16).
tenant_audit:
  stuck_after_attempts: 5       # log platform.tenant_audit.stuck from this attempt on
  backlog_alert_minutes: 15     # log platform.tenant_audit.backlog when the oldest waits longer
# Resumable shared-tier provisioning (platform.provisioning_runs; FR-PLT-002, docs/16 §5.4).
provisioning:
  # One runner at a time holds a run's lease; a crashed runner's lease expires after this and
  # the next retry or resume takes over. Longer than a normal run (KMS + role cloning).
  lease_seconds: 120
