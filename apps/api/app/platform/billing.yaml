      school_audit_log: {en: "School audit log (IDs and codes only)", te: "పాఠశాల ఆడిట్ లాగ్ (ఐడీలు మరియు కోడ్‌లు మాత్రమే)"}
      audit_archives: {en: "Signed audit archives (S3 Object Lock)", te: "సంతకం చేసిన ఆడిట్ ఆర్కైవ్‌లు"}
      billing_records: {en: "Invoices and billing account (business records)", te: "ఇన్‌వాయిస్‌లు మరియు బిల్లింగ్ ఖాతా"}
      backups: {en: "Database backups", te: "డేటాబేస్ బ్యాకప్‌లు"}
      dedicated_host: {en: "Dedicated host with all school data, files and backups", te: "పాఠశాల డేటా, ఫైళ్లు మరియు బ్యాకప్‌లతో ప్రత్యేక హోస్ట్"}
      staff_sign_in_accounts: {en: "Staff sign-in accounts", te: "సిబ్బంది సైన్-ఇన్ ఖాతాలు"}
    text:
      intro:
        en: "SchoolOS confirms that the data of the school named below was deleted from the SchoolOS service after the school left the service."
        te: "సేవను విడిచిపెట్టిన తర్వాత కింద పేర్కొన్న పాఠశాల డేటా SchoolOS సేవ నుండి తొలగించబడిందని SchoolOS ధృవీకరిస్తుంది."
      deleted: {en: "Deleted", te: "తొలగించబడింది"}
      retained: {en: "Kept, then deleted", te: "ఉంచబడింది, తర్వాత తొలగించబడుతుంది"}
      pending: {en: "Pending", te: "పెండింగ్‌లో ఉంది"}
      staff_sign_in_pending:
        en: "Removed by the separate staff account work (identity system); not part of this deletion."
        te: "ప్రత్యేక సిబ్బంది ఖాతా పని ద్వారా తొలగించబడుతుంది; ఈ తొలగింపులో భాగం కాదు."
      footer:
        en: "Counts only. This certificate contains no student or staff personal data."
        te: "సంఖ్యలు మాత్రమే. ఈ పత్రంలో విద్యార్థుల లేదా సిబ్బంది వ్యక్తిగత డేటా లేదు."
