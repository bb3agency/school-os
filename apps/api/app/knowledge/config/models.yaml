# Model roles, prices, limits and budget thresholds for the knowledge module.
# Sources: docs/06 §4.4, §5, §6, §9, §10.2, §12; ADR-0005 (Anthropic via the gateway only); FR-KB-008,
# FR-KB-011, SEC-020, NFR-CST-001. CLAUDE.md invariant 13: model IDs live here, never in code.
# Changing a model, limit or threshold needs a passing `make eval` (docs/06 §13); re-check model IDs
# and prices against the provider's current documentation whenever they change.
version: 1
provider: anthropic
# Anthropic list prices (first-party API), checked on this date.
prices_checked_on: 2026-09-27

roles:
  # kb.answer_model: tool-use loop and cited answer (mid tier, docs/06 §5 step 3, §12).
  answer:
    model: claude-sonnet-5
  # kb.router_model: optional fast path for trivial cases; enable only if evals show no loss (§5).
  router:
    model: claude-haiku-4-5-20251001
  # kb.metadata_model: strict-JSON document metadata (§4.4).
  metadata:
    model: claude-haiku-4-5-20251001
  # Translated-query fusion for code-mixed / cross-language questions (§6).
  translation:
    model: claude-haiku-4-5-20251001
  # Register-row extraction from page images (§10.2; FR-IMP-024 provider via the gateway).
  extraction:
    model: claude-haiku-4-5-20251001
  # Offline evaluation judge (top tier, §12, §13). Never used for product traffic.
  eval_judge:
    model: claude-opus-5-5
    offline_only: true

prices:
  claude-sonnet-5:
    input_usd_per_mtok: "2.00"
    output_usd_per_mtok: "10.00"
  claude-haiku-4-5-20251001:
    input_usd_per_mtok: "1.00"
    output_usd_per_mtok: "5.00"
  claude-opus-5-5:
    input_usd_per_mtok: "4.00"
    output_usd_per_mtok: "20.00"

limits:
  max_tool_rounds: 3                  # ADR-0008, §5 step 3
  tool_result_context_tokens: 12000   # §12 context budget
  first_token_p95_ms: 3000            # FR-KB-008
  full_answer_p95_ms: 10000           # FR-KB-008

budget:
  alert_fraction: 0.8                 # §12: 80% alert
  degrade_fraction: 1.0               # §12: at 100% -> search-only until reset or top-up

answer_checks:
  max_uncited_factual_fraction: 0.30  # §9 rule 3
