# Hybrid retrieval (docs/06 §6; FR-KB-001, FR-KB-002). The ACL predicate is code, not config:
# it is never tunable (invariant 8). Changes here need a passing `make eval`.
version: 1

fusion:
  method: rrf
  k: 60              # Reciprocal Rank Fusion constant
final_k: 12          # fused results returned by default

branches:
  vector:
    limit: 40        # HNSW, embedding <=> query vector
    iterative_scan: relaxed_order   # pgvector >= 0.8: filtered HNSW still fills the list
    max_scan_tuples: 20000
    # Route (docs/06 §6 "Authorised recall"): at most this many authorised chunks are ranked
    # exactly (recall 1.0, measured +40 ms at 4 000 rows); above it HNSW + iterative scan, which
    # stays >= 0.95 while authorised / shared-table rows >= limit / max_scan_tuples (safe to
    # ~2.5 M chunks in the shared table at these values; revisit before then).
    exact_search_max_rows: 5000
  full_text:
    limit: 40
    ts_config: simple
    match: any_term  # OR of the question's lexemes, ranked by ts_rank_cd
  trigram:
    limit: 20        # :q <% context_header (title, issuer, reference no., subject, section)
    word_similarity_threshold: 0.6  # pg_trgm default

hnsw_ef_search: 64   # SET LOCAL hnsw.ef_search (tune)

diversity:
  max_chunks_per_document: 3        # unless the question targets one document
  merge_adjacent_same_page: true

boosts:
  recency_when_latest_intent: true  # decay on issued_on when the question implies latest/current
  recency_max_factor: 1.0           # neutral until `make eval` tunes it
  recency_half_life_days: 180
  verified_answers: true            # doc_type = 'verified_answer'
  verified_answer_factor: 1.0       # neutral until `make eval` tunes it

# Contextual retrieval (docs/06 §4.11, §6 as built; PO approval 2026-09-30): "off" | "on".
# "on": ingestion asks the `contextualize` model role (models.yaml, contextual.yaml) for a short
# context situating each chunk in its document; it is embedded with the chunk and searched by the
# full-text (context_tsv) and keyword branches. It is never shown to users nor sent to the answer
# model. OFF until evals with the live providers show a gain; per environment the variable
# SOS_KB_CONTEXTUAL_CHUNKS overrides this value.
contextual_chunks: "off"

# Reranking of the fused candidates (docs/06 §6 "Optional rerank"). provider: "off" | "voyage"
# | "vertex" ("vertex" is a named candidate without an implementation: live mode refuses it).
# With SOS_KB_PROVIDER_MODE=fake any provider other than "off" runs the offline deterministic
# reranker. Per environment the variable SOS_KB_RERANK overrides `provider`. Flow: ACL filter in
# SQL -> hybrid candidates -> RRF + boosts -> the best `candidates` go to the reranker (their text
# read again under the ACL predicate and Aadhaar-masked again) -> at most `keep` passages. A
# failure or a call over `latency_budget_ms` keeps the RRF order (never blocks an answer).
rerank:
  provider: "off"
  candidates: 50            # fused candidates sent to the reranker (<= the candidate lists)
  keep: 12                  # passages kept after reranking (never more than the caller's k)
  latency_budget_ms: 1500   # provider timeout; over it the RRF order is kept
  max_passage_chars: 4000   # per passage sent (the provider counts tokens per query + passage)
  include_context: true     # send the context header and chunk context before the passage
  voyage:
    endpoint: https://api.voyageai.com/v1/rerank
    model: null             # chosen by evaluation (docs/06 §13.6); live refuses while null
    connect_timeout_s: 3

translated_query_fusion:
  enabled: true                     # original + translated query (small model), fused
