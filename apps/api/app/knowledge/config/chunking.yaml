# Extraction limits and structure-aware chunking (docs/06 §4.2-4.5). Telugu uses more tokens per
# word than English; the budgets in docs/06 §12 account for it. Changes here need a passing
# `make eval`.
version: 1
target_tokens:
  min: 350
  max: 600
overlap_tokens:
  min: 60
  max: 80
table_max_tokens: 1200     # tables kept whole up to this size, else split by row groups
contextual_header: true    # prepended for embedding and FTS, never shown to users
block_markers:             # "Sub:/Ref:/Order:" blocks typical of government circulars
  - "Sub:"
  - "Ref:"
  - "Order:"
# Deterministic token estimate (no tokenizer dependency). A word costs
# ceil(latin_chars / latin_chars_per_token + other_graphemes / other_graphemes_per_token), at
# least 1. One Telugu akshara per token is deliberately pessimistic, so a chunk stays within the
# embedding model's input limit whichever model ADR-0006 selects.
token_estimate:
  latin_chars_per_token: 4.0
  other_graphemes_per_token: 1.0
# Language of a block without a declared one (docs/06 §4.3): Telugu or English when that
# script has at least this share of the letters, otherwise "mixed".
language_dominant_share: 0.8
# What ingestion reads (docs/06 §4.1-4.2). PDF text layer: ADR-0027 (pypdfium2).
extraction:
  supported_mime_types:
    - "application/pdf"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "text/plain"
  # Identity evidence and raw import spreadsheets hold student records, not school knowledge:
  # they are never indexed.
  excluded_purposes:
    - "evidence"
    - "import_file"
  # C3 stays out of the index until retrieval enforces student.read_sensitive (fail closed).
  indexed_sensitivities:
    - "C1"
    - "C2"
  max_xml_bytes: 52428800   # one DOCX XML part, uncompressed (zip-bomb guard)
  max_text_chars: 2000000   # extracted characters per version; a longer version is not indexed
  # PDF text layer (ADR-0027). A version over any limit, encrypted, or with a page that needs
  # OCR is not indexed (an error code, never text).
  pdf:
    max_bytes: 26214400         # 25 MB, the upload limit (FR-DOC-001)
    max_pages: 300
    time_budget_seconds: 120    # per version, checked between pages
    max_objects_per_page: 50000
    max_chars_per_page: 50000
    min_letters_per_page: 16    # a page with graphics and fewer letters is a scan: needs OCR
    max_bad_char_share: 0.05    # unmapped/private-use characters: a legacy font, needs OCR
