# Circular reading and parent-notice drafting (M4; docs/06 §4.10, §10.4-10.5; FR-CIR-*, FR-NOTICE-*).
# CLAUDE.md invariant 13: prompts, limits and thresholds live here, never in code. The model and
# output cap of each call come from the role in models.yaml (`circular`, `notice`). Changing a
# prompt version or a limit needs a passing `make eval` (docs/06 §13; circular gates in gates.toml).
version: 1

reading:
  prompt: {id: circular_reading, version: 1}
  # Only the circular's own indexed (Aadhaar-masked) passages are sent, in order, up to these
  # limits; a longer circular is read from its start and the reading says it was cut.
  max_passages: 60
  max_input_chars: 24000
  # Server-side validation of the model's output (FR-CIR-003): longer values are cut at a word
  # boundary (quotes are never cut: a quote that is too long is dropped with its deadline).
  max_deadlines: 20
  max_title_chars: 200
  max_details_chars: 600
  max_summary_chars: 800
  max_field_chars: 200
  max_quote_chars: 400
  # Characters of a passage shown with a summary citation chip.
  snippet_chars: 240

notice:
  prompt: {id: parent_notice, version: 1}
  # A notice is drafted from the circular's passages (and the deadlines staff confirmed) or from
  # staff text; never from student records (FR-NOTICE-001).
  max_input_chars: 12000
  max_staff_text_chars: 4000
  max_title_chars: 120
  max_body_chars: 1500
