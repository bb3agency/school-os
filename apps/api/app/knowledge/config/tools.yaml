# Read-only record tools (docs/06 §7; ADR-0008; FR-KB-004, SEC-018, SEC-020). The whitelist is
# fixed by ADR-0008: the loader refuses any other tool. Permissions are catalog keys
# (app/authz/permissions.yaml); each tool also calls the owning module's service with the
# caller's UserContext, so RLS and scopes apply exactly as in the UI.
# `description` is what the answer model is told (prompt text, invariant 13; change it only with
# a passing `make eval`). A tool without a description is not offered to the model (every
# whitelisted tool is built since M2 wave 5; docs/06 §7 as built).
version: 1
tools:
  find_students:
    description: >-
      Find students the user can access by name (English or Telugu), admission number or
      class/section token such as 9b. Returns each student's ID with display fields only. Use the
      ID with get_student_facts to read a field.
    permission: student.read_basic
    max_results: 20                    # returns IDs + display fields
  get_student_facts:
    description: >-
      Get specific fields for ONE student the user can access. Returns each value with its source
      (admission_register, aadhaar_as_printed, udise_plus, board_registration, ...), verification
      status and as-of date. Ask only for fields needed to answer.
    permission: student.read_basic
    sensitive_permission: student.read_sensitive   # C3 masked unless held and explicitly asked
    max_fields: 8                      # the caller must name fields
    fields:
      - full_name
      - dob
      - gender
      - father_name
      - mother_name
      - admission_no
      - admission_date
      - current_class_section
      - status
      - leaving_date
  get_value_history:
    description: >-
      History of ONE field of ONE student the user can access: every recorded value, newest
      first, with its source, verification status, when it was recorded and whether it is still
      current. Use for "who changed", "when was it corrected" or "what was it before".
    permission: student.read_basic
    actor_names_permission: audit.read  # without it, actors read "a staff member"
    max_results: 10
    fields:                            # never a restricted (C3) attribute
      - full_name
      - dob
      - gender
      - father_name
      - mother_name
      - admission_date
      - leaving_date
  count_students:
    description: >-
      Count the students enrolled in the current academic year that the user can access, in
      total or by class, section or gender. Returns numbers only, never names. Small groups in a
      gender breakdown are not shown.
    permission: student.read_basic
    small_cell_min: 5                  # suppress cells < 5 in sensitive breakdowns
  list_findings:
    description: >-
      List data-quality findings (mismatches between the admission register, Aadhaar as printed,
      UDISE+ and board records) for students the user can access, most severe first. Optional
      filters: severity and status (unresolved by default).
    permission: dq.findings.read
    max_results: 20
  list_documents:
    description: >-
      List the school's documents the user can read (title, type, issuer, date, current
      version), newest first, optionally of one type. No content: use search_documents to read
      what a document says.
    permission: document.read          # metadata only; content via search_documents
    max_results: 20
  search_documents:
    description: >-
      Search the school's documents the user can read (circulars, policies, minutes, letters) and
      return the most relevant passages. Use for rules, dates, timings and announcements.
    permission: document.read
    max_results: 6                     # passages per call (docs/06 §12: prefer fewer, better)
    max_verified_answers: 2            # active verified answers first (docs/06 §2, §6 boost)
    # A question with one of these words prefers the newest documents (recency boost, §6).
    latest_terms: [latest, current, recent, newest, new, updated, revised, తాజా, ప్రస్తుత, కొత్త]
  # M6 (ADR-0032 Proposed, amending ADR-0008): offered only when the school's
  # tally.connector.enabled flag is on and the caller holds finance.read school-wide.
  get_fee_dues:
    description: >-
      Fee dues synced from the school's Tally accounts, for ONE student the user can access (pass
      the ID from find_students) or, without a student, the school totals. Uses only Tally
      ledgers a staff member has linked to the student; when none is linked, say SchoolOS has no
      fee figure for the student and never guess from names. Quote amounts exactly as given,
      with the Tally as-of date.
    permission: finance.read
  # ADR-0033 (amending ADR-0008): the caller's OWN earlier Ask conversations in this school (never
  # another person's, never deleted ones), decrypted in memory and scored by words; no index.
  search_my_conversations:
    description: >-
      Search the user's own earlier Ask conversations in this school (their questions and the
      answers they were given), newest conversations first. Use only when the user asks about
      something they asked or were told before, such as "what did I ask about fee dues last
      week". Earlier answers are not proof of current records: search the records again.
    permission: kb.ask
    max_results: 5                     # matching questions returned
    max_conversations: 30              # most recent conversations searched
