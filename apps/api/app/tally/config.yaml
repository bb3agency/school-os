# Tally read connector rules (M6; ADR-0032 Proposed; docs/05 §7.4, docs/07 §3 TB9). Versioned
# configuration shipped inside the package (invariant 13). Read by app/tally/config.py.
version: 1
# Per-school feature flag (platform.feature_flags). Unknown flag = off: every Tally route answers
# 404 and get_fee_dues is not offered until an operator switches it on for a school, which must
# not happen before ADR-0032 is accepted.
flag: tally.connector.enabled
enrolment:
  code_ttl_minutes: 30          # one-time code shown once to the owner
  # Enrolment brute force and lockout (audit 2026-10-04 AA-15; docs/07 TB9), fixed hour windows:
  max_attempts_per_address_per_hour: 20  # one client address, any school, any outcome; first
  max_failures_per_address_per_hour: 10  # wrong codes for one school from one address
  max_failures_per_school_per_hour: 50   # wrong codes for one school from all addresses
  max_active_devices: 2         # replace an office PC without a gap
signing:
  skew_seconds: 300             # |now - X-SOS-Timestamp|
  nonce_ttl_seconds: 600        # a nonce is accepted once in this window
  key_rotation_overlap_days: 7  # the old key stops working after this, or at first use of the new
  rotate_after_days: 90         # the agent asks for a new key after this many days
rate_limits_seconds:            # at most one accepted request per device and window
  config: 30
  catalog: 60
  sync: 240
  key_rotation: 3600
sync:
  interval_minutes: 30          # told to the agent in /config
  max_parties: 5000
  max_groups: 500
  min_agent_version: 0.1.0      # older agents stop syncing and say so
silence:
  notify_after_hours: 48        # in-app notification when an active agent has not called since
retention:
  sync_days: 400                # sync records (counts only) older than this are deleted
mapping:
  max_candidates: 5             # students suggested for an unlinked ledger (a person links)
# FM-03 voucher export file and ledger-vs-Tally check (FR-TALLY-011..030). SchoolOS never writes
# to Tally: the accountant imports the file by hand (Gateway of Tally > Import > Vouchers). The
# envelope, tags and voucher type names follow the classic Tally XML import format that TallyPrime
# still accepts; not yet tried in a pilot school's test company, hence verified: false.
vouchers:
  verified: false
  source: "Tally XML import envelope (ERP 9 / TallyPrime 'Import Data' > Vouchers); to be checked in a pilot accountant's test company"
  tally_request: Import Data
  report_name: Vouchers
  voucher_types:              # the school may have renamed them in Tally
    receipt: Receipt
    payment: Payment          # cancellations and refunds: money back out of a cash or bank ledger
    journal: Journal          # fee demand (charges, late fees, concessions, adjustments)
  max_period_days: 366        # one export covers at most this many days
  max_vouchers: 20000         # a larger period is refused; export it in parts
  history_limit: 50           # exports listed on the screen
  ledger_name_max_length: 100 # Tally allows longer names; school ledgers are far shorter
  defaults:                   # lead decision D85 (PO to confirm): the research report's choice
    party_mode: student       # one Tally party per student (its linked ledger), else receivable
    include_demand: false     # the school raises fee demand in Tally itself; receipts only
    receivable_ledger: Fee receivable
    mode_ledgers:
      cash: Cash
