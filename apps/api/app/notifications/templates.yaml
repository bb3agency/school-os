# In-app notification templates (C11, FR-NOT-001). Versioned configuration shipped inside the
# package (the API image does not copy /config). Rendered server-side in the reader's language
# (Accept-Language: en or te); the stored notification keeps only the key and its params.
#
# Per template
#   params         every placeholder the template may use, and nothing else. Values are IDs,
#                  counts and codes only (validated like audit summaries): never names, dates of
#                  birth, phone numbers or free text.
#   resource_type  what the notification links to (resource_id is passed by the caller)
#   en / te        title + body. ICU-style placeholders:
#                    {count}                                     the value
#                    {count, plural, =0 {...} one {# row} other {# rows}}   # = the number
#                    {code, select, a {...} b {...} other {...}}            by code
#
# Writing rules (CLAUDE.md §10): plain language, sentence case, say what to do next. Telugu is
# written for office staff, not translated word for word.
version: 1

retention:
  # Read notifications are deleted after this many days (daily job notifications.purge_read).
  read_days: 90

templates:
  change_request.submitted:
    params: [change_request_id, student_id]
    resource_type: change_request
    en:
      title: Correction waiting for your approval
      body: A correction to a student's record is waiting for your approval. Open it to see the evidence and approve or reject it.
    te:
      title: మీ ఆమోదం కోసం సవరణ వేచి ఉంది
      body: ఒక విద్యార్థి రికార్డులో సవరణ మీ ఆమోదం కోసం వేచి ఉంది. ఆధారం చూసి ఆమోదించడానికి లేదా తిరస్కరించడానికి దాన్ని తెరవండి.

  change_request.approved:
    params: [change_request_id, student_id]
    resource_type: change_request
    en:
      title: Correction approved
      body: Your correction request was approved and the student's record is updated.
    te:
      title: సవరణ ఆమోదించబడింది
      body: మీ సవరణ అభ్యర్థన ఆమోదించబడింది. విద్యార్థి రికార్డు నవీకరించబడింది.

  change_request.rejected:
    params: [change_request_id, student_id]
    resource_type: change_request
    en:
      title: Correction not approved
      body: Your correction request was not approved. Open it to see why.
    te:
      title: సవరణ ఆమోదించబడలేదు
      body: మీ సవరణ అభ్యర్థన ఆమోదించబడలేదు. కారణం తెలుసుకోవడానికి దాన్ని తెరవండి.

  change_request.expired:
    params: [change_request_id, student_id]
    resource_type: change_request
    en:
      title: Correction request expired
      body: Nobody decided your correction request in time, so it has expired. Submit it again if the correction is still needed.
    te:
      title: సవరణ అభ్యర్థన గడువు ముగిసింది
      body: మీ సవరణ అభ్యర్థనపై సమయానికి ఎవరూ నిర్ణయం తీసుకోలేదు, కాబట్టి దాని గడువు ముగిసింది. సవరణ ఇంకా అవసరమైతే మళ్లీ సమర్పించండి.

  dq.run.completed:
    params: [run_id, blockers, warnings]
    resource_type: dq_run
    en:
      title: Data check finished
      body: "The data check found {blockers, plural, =0 {no problems that block submission} one {# problem that blocks submission} other {# problems that block submission}} and {warnings, plural, =0 {no warnings} one {# warning} other {# warnings}}."
    te:
      title: డేటా తనిఖీ పూర్తయింది
      body: "డేటా తనిఖీలో {blockers, plural, =0 {సమర్పణను ఆపే సమస్యలు ఏవీ లేవు} one {సమర్పణను ఆపే # సమస్య ఉంది} other {సమర్పణను ఆపే # సమస్యలు ఉన్నాయి}}, {warnings, plural, =0 {హెచ్చరికలు ఏవీ లేవు} one {# హెచ్చరిక ఉంది} other {# హెచ్చరికలు ఉన్నాయి}}."

  import.validated:
    params: [import_id, valid_rows, error_rows]
    resource_type: import_batch
    en:
      title: Your file has been checked
      body: "{valid_rows, plural, =0 {No rows are} one {# row is} other {# rows are}} ready to add. {error_rows, plural, =0 {Nothing needs fixing.} one {# row needs fixing before you add the file.} other {# rows need fixing before you add the file.}}"
    te:
      title: మీ ఫైల్ తనిఖీ పూర్తయింది
      body: "{valid_rows, plural, =0 {జోడించడానికి సిద్ధంగా ఉన్న వరుసలు లేవు.} one {# వరుస జోడించడానికి సిద్ధంగా ఉంది.} other {# వరుసలు జోడించడానికి సిద్ధంగా ఉన్నాయి.}} {error_rows, plural, =0 {సరిచేయాల్సింది ఏమీ లేదు.} one {ఫైల్ జోడించే ముందు # వరుసను సరిచేయాలి.} other {ఫైల్ జోడించే ముందు # వరుసలను సరిచేయాలి.}}"

  import.committed:
    params: [import_id, rows]
    resource_type: import_batch
    en:
      title: Records added
      body: "{rows, plural, one {# row was} other {# rows were}} added to the student records."
    te:
      title: రికార్డులు జోడించబడ్డాయి
      body: "{rows, plural, one {# వరుస} other {# వరుసలు}} విద్యార్థి రికార్డులకు జోడించబడ్డాయి."

  # Sent to the person who uploaded the file when someone else reverts it (FR-IMP-005).
  import.reverted:
    params: [import_id, rows]
    resource_type: import_batch
    en:
      title: A file you added was undone
      body: "Another staff member undid your import. {rows, plural, =0 {No rows were changed.} one {# row was taken back out of the student records.} other {# rows were taken back out of the student records.}} Open the import to see the details."
    te:
      title: మీరు జోడించిన ఫైల్ వెనక్కి తీసుకోబడింది
      body: "మీరు జోడించిన ఫైల్‌ను మరో సిబ్బంది వెనక్కి తీసుకున్నారు. {rows, plural, =0 {ఏ వరుసలూ మారలేదు.} one {# వరుస విద్యార్థి రికార్డుల నుండి తీసివేయబడింది.} other {# వరుసలు విద్యార్థి రికార్డుల నుండి తీసివేయబడ్డాయి.}} వివరాల కోసం దిగుమతిని తెరవండి."

  export.ready:
    params: [export_id, students]
    resource_type: export
    en:
      title: Your export is ready
      body: "Your export of {students, plural, one {# student} other {# students}} is ready to download. The file is kept for up to 7 days; you can make a new one at any time."
    te:
      title: మీ ఎగుమతి సిద్ధంగా ఉంది
      body: "{students, plural, one {# విద్యార్థి} other {# మంది విద్యార్థుల}} వివరాలతో మీ ఎగుమతి డౌన్‌లోడ్‌కు సిద్ధంగా ఉంది. ఫైల్ గరిష్టంగా 7 రోజులు ఉంచబడుతుంది; ఎప్పుడైనా కొత్తది తయారు చేయవచ్చు."

  export.failed:
    params: [export_id]
    resource_type: export
    en:
      title: Your export could not be made
      body: Your export could not be made. Try again. If it happens again, contact SchoolOS support.
    te:
      title: మీ ఎగుమతిని తయారు చేయలేకపోయాము
      body: మీ ఎగుమతిని తయారు చేయలేకపోయాము. మళ్లీ ప్రయత్నించండి. మళ్లీ ఇలాగే జరిగితే SchoolOS సపోర్ట్‌ను సంప్రదించండి.

  admin.tenant_export.ready:
    params: [tenant_export_id, hours]
    resource_type: tenant_export
    en:
      title: Your school's data export is ready
      body: "The full export of your school's records, documents and audit log is ready. Download it within {hours, plural, one {# hour} other {# hours}}; after that it is deleted and you can make a new one. You will be asked to sign in again with your second factor."
    te:
      title: మీ పాఠశాల డేటా ఎగుమతి సిద్ధంగా ఉంది
      body: "మీ పాఠశాల రికార్డులు, పత్రాలు మరియు ఆడిట్ లాగ్ పూర్తి ఎగుమతి సిద్ధంగా ఉంది. {hours, plural, one {# గంటలోపు} other {# గంటలలోపు}} డౌన్‌లోడ్ చేసుకోండి; ఆ తర్వాత అది తొలగించబడుతుంది, మీరు కొత్తది తయారు చేయవచ్చు. మీ రెండవ ధృవీకరణతో మళ్లీ సైన్ ఇన్ చేయమని అడుగుతాము."

  admin.tenant_export.failed:
    params: [tenant_export_id]
    resource_type: tenant_export
    en:
      title: Your school's data export could not be made
      body: The full export of your school's data could not be made. Try again. If it happens again, contact SchoolOS support.
    te:
      title: మీ పాఠశాల డేటా ఎగుమతిని తయారు చేయలేకపోయాము
      body: మీ పాఠశాల డేటా పూర్తి ఎగుమతిని తయారు చేయలేకపోయాము. మళ్లీ ప్రయత్నించండి. మళ్లీ ఇలాగే జరిగితే SchoolOS సపోర్ట్‌ను సంప్రదించండి.

  extraction.batch.ready:
    params: [batch_id, rows, low_confidence_rows]
    resource_type: extraction_batch
    en:
      title: Register photos are ready to check
      body: "{rows, plural, =0 {No rows were found on the photos. Check that each photo shows one register page clearly.} one {# row from the register photos is waiting for you to check.} other {# rows from the register photos are waiting for you to check.}} {low_confidence_rows, plural, =0 {} one {# row has unclear values, marked for a closer look.} other {# rows have unclear values, marked for a closer look.}}"
    te:
      title: రిజిస్టర్ ఫోటోలు తనిఖీకి సిద్ధంగా ఉన్నాయి
      body: "{rows, plural, =0 {ఫోటోలలో వరుసలు ఏవీ కనిపించలేదు. ప్రతి ఫోటోలో ఒక రిజిస్టర్ పేజీ స్పష్టంగా ఉందో లేదో చూడండి.} one {రిజిస్టర్ ఫోటోల నుండి # వరుస మీ తనిఖీ కోసం వేచి ఉంది.} other {రిజిస్టర్ ఫోటోల నుండి # వరుసలు మీ తనిఖీ కోసం వేచి ఉన్నాయి.}} {low_confidence_rows, plural, =0 {} one {# వరుసలో అస్పష్టమైన విలువలు ఉన్నాయి, జాగ్రత్తగా చూడండి.} other {# వరుసలలో అస్పష్టమైన విలువలు ఉన్నాయి, జాగ్రత్తగా చూడండి.}}"

  extraction.batch.failed:
    params: [batch_id]
    resource_type: extraction_batch
    en:
      title: Register photos could not be read
      body: The register photos could not be read. Try again later. If it happens again, contact SchoolOS support.
    te:
      title: రిజిస్టర్ ఫోటోలను చదవలేకపోయాము
      body: రిజిస్టర్ ఫోటోలను చదవలేకపోయాము. కొంత సమయం తర్వాత మళ్లీ ప్రయత్నించండి. మళ్లీ ఇలాగే జరిగితే SchoolOS సపోర్ట్‌ను సంప్రదించండి.

  document.quarantined:
    params: [document_id]
    resource_type: document
    en:
      title: A file was blocked
      body: A file you uploaded failed the virus check and was not saved. Check the file on your computer and upload a clean copy.
    te:
      title: ఒక ఫైల్ నిలిపివేయబడింది
      body: మీరు అప్‌లోడ్ చేసిన ఫైల్ వైరస్ తనిఖీలో విఫలమైంది, కాబట్టి అది సేవ్ కాలేదు. మీ కంప్యూటర్‌లో ఫైల్‌ను తనిఖీ చేసి, సురక్షితమైన ప్రతిని మళ్లీ అప్‌లోడ్ చేయండి.

  breakglass.requested:
    params: [grant_id, minutes, reason_code]
    resource_type: breakglass_grant
    en:
      title: SchoolOS support asks for access
      body: "SchoolOS support asks to see your school's records for {minutes} minutes {reason_code, select, support_request {to answer your support request} security_incident {because of a security incident} legal_obligation {because the law requires it} other {}}. Review the request and approve or deny it."
    te:
      title: SchoolOS సపోర్ట్ అనుమతి కోరుతోంది
      body: "{reason_code, select, support_request {మీ సపోర్ట్ అభ్యర్థనకు సమాధానం ఇవ్వడానికి} security_incident {భద్రతా సంఘటన కారణంగా} legal_obligation {చట్టపరమైన అవసరం కారణంగా} other {}} SchoolOS సపోర్ట్ మీ పాఠశాల రికార్డులను {minutes} నిమిషాల పాటు చూడటానికి అనుమతి కోరుతోంది. అభ్యర్థనను పరిశీలించి ఆమోదించండి లేదా తిరస్కరించండి."

  breakglass.approved:
    params: [grant_id, minutes]
    resource_type: breakglass_grant
    en:
      title: Support access approved
      body: SchoolOS support can now see your school's records (read-only). Access ends by itself after {minutes} minutes, and you can end it earlier from the Support access page.
    te:
      title: సపోర్ట్ అనుమతి ఆమోదించబడింది
      body: SchoolOS సపోర్ట్ ఇప్పుడు మీ పాఠశాల రికార్డులను చూడగలదు (చూడటానికి మాత్రమే; మార్పులు చేయడం సాధ్యం కాదు). {minutes} నిమిషాల తర్వాత అనుమతి దానంతట అదే ముగుస్తుంది. ముందే ముగించాలంటే 'సపోర్ట్ అనుమతి' పేజీని తెరవండి.

  breakglass.denied:
    params: [grant_id]
    resource_type: breakglass_grant
    en:
      title: Support access denied
      body: The request from SchoolOS support to see your school's records was denied. SchoolOS support has no access.
    te:
      title: సపోర్ట్ అనుమతి తిరస్కరించబడింది
      body: మీ పాఠశాల రికార్డులను చూడటానికి SchoolOS సపోర్ట్ చేసిన అభ్యర్థన తిరస్కరించబడింది. SchoolOS సపోర్ట్‌కు ఎలాంటి అనుమతి లేదు.

  breakglass.revoked:
    params: [grant_id]
    resource_type: breakglass_grant
    en:
      title: Support access ended
      body: Your school ended SchoolOS support access. Support can no longer see your records.
    te:
      title: సపోర్ట్ అనుమతి ముగిసింది
      body: మీ పాఠశాల SchoolOS సపోర్ట్ అనుమతిని ముగించింది. సపోర్ట్ ఇకపై మీ రికార్డులను చూడలేదు.

  breakglass.expired:
    params: [grant_id]
    resource_type: breakglass_grant
    en:
      title: Support access time is over
      body: The time for SchoolOS support access is over. Support can no longer see your records. Everything they looked at is in the audit log.
    te:
      title: సపోర్ట్ అనుమతి సమయం ముగిసింది
      body: SchoolOS సపోర్ట్ అనుమతి సమయం ముగిసింది. సపోర్ట్ ఇకపై మీ రికార్డులను చూడలేదు. వారు చూసినవన్నీ ఆడిట్ లాగ్‌లో ఉన్నాయి.

  breakglass.emergency:
    params: [grant_id, minutes, reason_code]
    resource_type: breakglass_grant
    en:
      title: Emergency support access opened
      body: "SchoolOS opened emergency access to your school's records {reason_code, select, security_incident {because of a security incident} legal_obligation {because the law requires it} other {}}. Two SchoolOS staff confirmed it. Access is read-only and ends after {minutes} minutes. You can end it now from the Support access page; everything support looks at is in the audit log."
    te:
      title: అత్యవసర సపోర్ట్ అనుమతి తెరవబడింది
      body: "{reason_code, select, security_incident {భద్రతా సంఘటన కారణంగా} legal_obligation {చట్టపరమైన అవసరం కారణంగా} other {అత్యవసర కారణంగా}} SchoolOS మీ పాఠశాల రికార్డులకు అత్యవసర అనుమతి తెరిచింది. ఇద్దరు SchoolOS సిబ్బంది దీన్ని నిర్ధారించారు. అనుమతి చూడటానికి మాత్రమే, {minutes} నిమిషాల తర్వాత ముగుస్తుంది. 'సపోర్ట్ అనుమతి' పేజీ నుండి మీరు దీన్ని ఇప్పుడే ముగించవచ్చు. సపోర్ట్ చూసినవన్నీ ఆడిట్ లాగ్‌లో ఉంటాయి."

  announcement.new:
    params: [announcement_id]
    resource_type: announcement
    en:
      title: New message from SchoolOS
      body: There is a new message from SchoolOS. Read it in the banner at the top of the page.
    te:
      title: SchoolOS నుండి కొత్త సందేశం
      body: SchoolOS నుండి కొత్త సందేశం వచ్చింది. పేజీ పైభాగంలోని బ్యానర్‌లో దాన్ని చదవండి.

  # --- certificates (M3; US-1102, FR-CERT-012) ------------------------------------------------
  certificate.approval_requested:
    params: [certificate_id, student_id, certificate_type]
    resource_type: certificate
    en:
      title: "{certificate_type, select, transfer {Transfer certificate} other {Certificate}} waiting for your approval"
      body: "A {certificate_type, select, transfer {transfer certificate} other {certificate}} is waiting for your approval. Open it to check the draft, then approve or reject it."
    te:
      title: "మీ ఆమోదం కోసం {certificate_type, select, transfer {బదిలీ ధృవీకరణ పత్రం} other {ధృవీకరణ పత్రం}} వేచి ఉంది"
      body: "ఒక {certificate_type, select, transfer {బదిలీ ధృవీకరణ పత్రం} other {ధృవీకరణ పత్రం}} మీ ఆమోదం కోసం వేచి ఉంది. ముసాయిదా చూసి ఆమోదించండి లేదా తిరస్కరించండి."

  certificate.approved:
    params: [certificate_id, student_id, certificate_type]
    resource_type: certificate
    en:
      title: Certificate approved
      body: The certificate you prepared was approved and has its serial number. Print it from the certificate page.
    te:
      title: ధృవీకరణ పత్రం ఆమోదించబడింది
      body: మీరు తయారు చేసిన ధృవీకరణ పత్రం ఆమోదించబడింది, క్రమ సంఖ్య ఇవ్వబడింది. ధృవీకరణ పత్రం పేజీ నుండి ముద్రించండి.

  certificate.rejected:
    params: [certificate_id, student_id, certificate_type]
    resource_type: certificate
    en:
      title: Certificate not approved
      body: The certificate you prepared was not approved. Open it to see why.
    te:
      title: ధృవీకరణ పత్రం ఆమోదించబడలేదు
      body: మీరు తయారు చేసిన ధృవీకరణ పత్రం ఆమోదించబడలేదు. కారణం తెలుసుకోవడానికి దాన్ని తెరవండి.
  # --- circulars and tasks (M4; FR-CIR-001, FR-CIR-005, FR-TASK-003, FR-TASK-007) ---------------
  circular.read_ready:
    params: [document_id, suggestions]
    resource_type: circular
    en:
      title: Circular read, please check
      body: "A circular was read with AI. {suggestions, plural, =0 {No deadlines were found; check the circular and mark it reviewed.} one {# deadline is suggested; confirm or dismiss it.} other {# deadlines are suggested; confirm or dismiss each one.}} Nothing becomes a task until you confirm it."
    te:
      title: సర్క్యులర్ చదవబడింది, దయచేసి చూడండి
      body: "ఒక సర్క్యులర్‌ను AI చదివింది. {suggestions, plural, =0 {గడువులు ఏవీ కనబడలేదు; సర్క్యులర్ చూసి సమీక్షించినట్లు గుర్తించండి.} one {# గడువు సూచించబడింది; దాన్ని నిర్ధారించండి లేదా తీసివేయండి.} other {# గడువులు సూచించబడ్డాయి; ఒక్కొక్కటి నిర్ధారించండి లేదా తీసివేయండి.}} మీరు నిర్ధారించే వరకు ఏదీ పనిగా మారదు."

  circular.needs_review:
    params: [document_id, code]
    resource_type: circular
    en:
      title: Circular needs manual review
      body: "A circular could not be read with AI {code, select, ai_disabled {because AI is switched off for your school} ai_budget_exhausted {because this month's AI budget is used up} no_text {because it has no readable text} other {just now}}. Open it, read it yourself and add its tasks by hand, or try again later."
    te:
      title: సర్క్యులర్‌ను మీరే చూడాలి
      body: "{code, select, ai_disabled {మీ పాఠశాలకు AI ఆపివేయబడినందున} ai_budget_exhausted {ఈ నెల AI బడ్జెట్ పూర్తయినందున} no_text {చదవగలిగే వచనం లేనందున} other {ప్రస్తుతం}} ఒక సర్క్యులర్‌ను AI చదవలేకపోయింది. దాన్ని తెరిచి మీరే చదివి, పనులను చేతితో జోడించండి, లేదా తర్వాత మళ్లీ ప్రయత్నించండి."

  task.assigned:
    params: [task_id]
    resource_type: task
    en:
      title: New task for you
      body: A task was given to you. Open it to see what is needed and by when.
    te:
      title: మీకు కొత్త పని
      body: మీకు ఒక పని ఇవ్వబడింది. ఏమి చేయాలో, ఎప్పటిలోగా చేయాలో చూడటానికి దాన్ని తెరవండి.

  task.due_soon:
    params: [task_id, days]
    resource_type: task
    en:
      title: Task due soon
      body: "One of your tasks is due {days, plural, =0 {today} one {tomorrow} other {in # days}}. Open it and mark it done when it is finished."
    te:
      title: పని గడువు దగ్గర పడింది
      body: "మీ పనుల్లో ఒకదాని గడువు {days, plural, =0 {ఈరోజే} one {రేపు} other {# రోజుల్లో}}. దాన్ని తెరిచి, పూర్తయ్యాక పూర్తయినట్లు గుర్తించండి."

  task.overdue:
    params: [task_id]
    resource_type: task
    en:
      title: Task overdue
      body: One of your tasks is past its due date. Finish it as soon as you can, or ask the office to change the date.
    te:
      title: పని గడువు దాటింది
      body: మీ పనుల్లో ఒకదాని గడువు దాటిపోయింది. వీలైనంత త్వరగా పూర్తి చేయండి, లేదా తేదీ మార్చమని కార్యాలయాన్ని అడగండి.

  # M5 early warning (FR-EW-006). Params are the flag id and the rule code only: never the
  # student's name or what the rule saw (the flag shows that to people allowed to see it).
  insights.flag_raised:
    params: [flag_id, rule]
    resource_type: insight_flag
    en:
      title: A student may need follow-up
      body: "{rule, select, attendance_streak {A student was absent on several school days in a row.} attendance_rate {A student's attendance has dropped.} course_low {A student's marks in the latest exam are low.} course_decline {A student's marks dropped between two exams.} behaviour_concerns {Several concern notes were written about a student.} other {A concern was raised about a student.}} Open the flag, talk to the student or a parent, and record what you did by the due date."
    te:
      title: ఒక విద్యార్థిని గమనించాలి
      body: "{rule, select, attendance_streak {ఒక విద్యార్థి వరుసగా కొన్ని బడి రోజులు గైర్హాజరయ్యారు.} attendance_rate {ఒక విద్యార్థి హాజరు తగ్గింది.} course_low {తాజా పరీక్షలో ఒక విద్యార్థి మార్కులు తక్కువగా ఉన్నాయి.} course_decline {రెండు పరీక్షల మధ్య ఒక విద్యార్థి మార్కులు తగ్గాయి.} behaviour_concerns {ఒక విద్యార్థి గురించి పలు ఆందోళన నోట్లు రాశారు.} other {ఒక విద్యార్థి గురించి ఆందోళన వ్యక్తమైంది.}} ఫ్లాగ్‌ను తెరిచి, విద్యార్థితో లేదా తల్లిదండ్రులతో మాట్లాడి, గడువులోగా మీరు చేసినది నమోదు చేయండి."

  insights.flag_assigned:
    params: [flag_id]
    resource_type: insight_flag
    en:
      title: A follow-up flag was given to you
      body: A student's early-warning flag is now yours. Open it to see why it was raised and record what you do.
    te:
      title: ఒక ఫాలో-అప్ ఫ్లాగ్ మీకు ఇవ్వబడింది
      body: ఒక విద్యార్థి ముందస్తు హెచ్చరిక ఫ్లాగ్ ఇప్పుడు మీది. ఎందుకు వచ్చిందో చూడటానికి దాన్ని తెరిచి, మీరు చేసినది నమోదు చేయండి.

  insights.flag_overdue:
    params: [flag_id]
    resource_type: insight_flag
    en:
      title: Follow-up is overdue
      body: A student's flag is past its due date and nobody has recorded an action yet. Open it and record what was done, or close it with a reason.
    te:
      title: ఫాలో-అప్ గడువు దాటింది
      body: ఒక విద్యార్థి ఫ్లాగ్ గడువు దాటింది, ఇంకా ఎవరూ చర్యను నమోదు చేయలేదు. దాన్ని తెరిచి చేసినది నమోదు చేయండి, లేదా కారణంతో మూసివేయండి.
