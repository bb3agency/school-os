# Email templates (docs/03 §5: Email via Amazon SES, templates EN/TE). Versioned configuration
# shipped inside the package (app/notifications/email.py reads it; invariant 13).
#
# Per template
#   params   every placeholder, and nothing else. The worker fills them from the school's and
#            the recipient's records when it sends; they never travel in an outbox payload.
#   en / te  subject (one line) + plain-text body, same ICU subset as templates.yaml.
#
# Writing rules (CLAUDE.md §10): plain language, sentence case, say what to do next. Telugu is
# written for office staff, not translated word for word. Emails never contain student data.
version: 1

invitation:
  # Invitations are accepted on first sign-in within this many days of the invite
  # (migration 0007_accept_invitations: interval '30 days'; a test keeps the two equal).
  valid_days: 30
  # One invitation email per person per this many seconds (POST /users/{id}/invitation-email).
  resend_cooldown_s: 600

templates:
  invitation.staff:
    params: [school, sign_in_url, expires_on]
    en:
      subject: "You have been invited to {school} on SchoolOS"
      body: |
        Hello,

        You have been given access to {school} on SchoolOS, the school office system.

        To accept, sign in at {sign_in_url} with the SchoolOS account details you received
        separately. Please sign in before {expires_on}; after that, ask the school office to
        invite you again.

        If you did not expect this email, you can ignore it. Nobody can use your access
        without your sign-in details.

        SchoolOS
    te:
      subject: "SchoolOSలో {school}కు మీకు ఆహ్వానం వచ్చింది"
      body: |
        నమస్కారం,

        SchoolOS (పాఠశాల కార్యాలయ వ్యవస్థ)లో {school}కు మీకు ప్రవేశం ఇవ్వబడింది.

        అంగీకరించడానికి, మీకు విడిగా అందిన SchoolOS ఖాతా వివరాలతో {sign_in_url} లో సైన్ ఇన్
        చేయండి. {expires_on} లోపు సైన్ ఇన్ చేయండి; ఆ తర్వాత అయితే మళ్లీ ఆహ్వానించమని పాఠశాల
        కార్యాలయాన్ని అడగండి.

        ఈ ఈమెయిల్ మీరు ఊహించకపోతే, దీన్ని పట్టించుకోనవసరం లేదు. మీ సైన్ ఇన్ వివరాలు లేకుండా
        మీ ప్రవేశాన్ని ఎవరూ ఉపయోగించలేరు.

        SchoolOS

  # --- 100 % alerts (docs/16 §5.10, §19 Q16; FR-PLT-020, FR-PLT-021; D70) -------------------
  # Queued by app.notifications.quota_sync with the in-app notice of the same alert, for the
  # owner and the principal, once per kind, billing period and recipient. The worker fills the
  # values from that notice (counts and codes only), the school's name and the app's address.
  # 80 % stays in-app only. Nothing is switched off; no amounts other than the counts.
  billing.ai_answers_used_up:
    params: [school, level, included, sign_in_url]
    en:
      subject: "{school}: all AI answers in your bundle are used"
      body: |
        Hello,

        {level, select, used_up_last_month {Last month, {school} used all {included} answers included in its AI answer bundle.} other {This month, {school} has used all {included} answers included in its AI answer bundle.}}

        Nothing is switched off: Ask keeps answering. Each extra answer is billed on your next invoice at your bundle's price per extra answer.

        To see the count, sign in at {sign_in_url} and open Settings > Plan and billing.

        You get this email because you are the school's owner or principal on SchoolOS.

        SchoolOS
    te:
      subject: "{school}: మీ బండిల్‌లోని AI సమాధానాలన్నీ వాడేశారు"
      body: |
        నమస్కారం,

        {level, select, used_up_last_month {గత నెల {school} తన AI సమాధానాల బండిల్‌లో ఉన్న {included} సమాధానాలన్నీ వాడేసింది.} other {ఈ నెల {school} తన AI సమాధానాల బండిల్‌లో ఉన్న {included} సమాధానాలన్నీ వాడేసింది.}}

        ఏదీ ఆపివేయబడలేదు: Ask సమాధానాలు ఇస్తూనే ఉంటుంది. ప్రతి అదనపు సమాధానానికి మీ బండిల్ ధర ప్రకారం తదుపరి ఇన్‌వాయిస్‌లో ఛార్జ్ ఉంటుంది.

        లెక్క చూడటానికి {sign_in_url} లో సైన్ ఇన్ చేసి సెట్టింగ్‌లు > ప్లాన్ మరియు బిల్లింగ్ తెరవండి.

        మీరు SchoolOSలో పాఠశాల యజమాని లేదా ప్రిన్సిపాల్ కాబట్టి ఈ ఈమెయిల్ మీకు వచ్చింది.

        SchoolOS
  billing.plan_limit_reached:
    params: [school, metric, sign_in_url]
    en:
      subject: "{school} has reached its plan's limit for {metric, select, students {active students} staff_users {staff users} documents {documents} storage_gb {storage} ai_tokens_month {AI usage} ai_budget_inr {the AI budget} other {an item}}"
      body: |
        Hello,

        {school} has reached its plan's limit for {metric, select, students {active students} staff_users {staff users} documents {documents} storage_gb {storage} ai_tokens_month {AI usage} ai_budget_inr {the AI budget} other {an item}}.

        {metric, select, ai_budget_inr {Apart from Ask, nothing is switched off: until the AI budget renews, Ask shows search results without a written answer, and everything else keeps working.} other {Limits never block work: nothing is switched off and everyone can keep working as usual.}}

        To see your plan, sign in at {sign_in_url} and open Settings > Plan and billing, or ask SchoolOS support about a larger plan.

        You get this email because you are the school's owner or principal on SchoolOS.

        SchoolOS
    te:
      subject: "{school}: {metric, select, students {విద్యార్థులు} staff_users {సిబ్బంది వినియోగదారులు} documents {పత్రాలు} storage_gb {నిల్వ} ai_tokens_month {AI వినియోగం} ai_budget_inr {AI బడ్జెట్} other {వినియోగం}} ప్లాన్ పరిమితికి చేరింది"
      body: |
        నమస్కారం,

        {school} {metric, select, students {విద్యార్థులు} staff_users {సిబ్బంది వినియోగదారులు} documents {పత్రాలు} storage_gb {నిల్వ} ai_tokens_month {AI వినియోగం} ai_budget_inr {AI బడ్జెట్} other {వినియోగం}} విషయంలో తన ప్లాన్ పరిమితికి చేరింది.

        {metric, select, ai_budget_inr {Ask తప్ప ఏదీ ఆపివేయబడలేదు: బడ్జెట్ మళ్లీ వచ్చే వరకు Ask రాసిన సమాధానం లేకుండా వెతుకులాట ఫలితాలు మాత్రమే చూపిస్తుంది; మిగతావన్నీ పని చేస్తాయి.} other {పరిమితులు పనిని ఎప్పుడూ ఆపవు: ఏదీ ఆపివేయబడలేదు, అందరూ యథావిధిగా పని చేయవచ్చు.}}

        మీ ప్లాన్ చూడటానికి {sign_in_url} లో సైన్ ఇన్ చేసి సెట్టింగ్‌లు > ప్లాన్ మరియు బిల్లింగ్ తెరవండి, లేదా పెద్ద ప్లాన్ గురించి SchoolOS సపోర్ట్‌ను అడగండి.

        మీరు SchoolOSలో పాఠశాల యజమాని లేదా ప్రిన్సిపాల్ కాబట్టి ఈ ఈమెయిల్ మీకు వచ్చింది.

        SchoolOS

  # --- weekly management brief (FA-05; FR-BRF-012; D85) -------------------------------------
  # Queued by app.brief with the week's in-app notice, only for members who turned the e-mail
  # on (opt-in). The worker fills the counts from that notice, the school's name and the app's
  # address. Counts and a sign-in link only: no names, no student data, no fee amounts.
  brief.weekly:
    params: [school, sign_in_url]
    en:
      subject: "{school}: your weekly school brief"
      body: |
        Hello,

        Last week's brief for {school} is ready on SchoolOS.

        To see readiness by board, certificates issued and fee totals, sign in at {sign_in_url} and open Weekly brief.

        You get this email because you turned on the weekly brief e-mail. To stop it, open Weekly brief and turn the e-mail off.

        SchoolOS
    te:
      subject: "{school}: మీ వారపు పాఠశాల సారాంశం"
      body: |
        నమస్కారం,

        SchoolOSలో {school} గత వారపు సారాంశం సిద్ధంగా ఉంది.

        వివరాల కోసం {sign_in_url} లో సైన్ ఇన్ చేసి వారపు సారాంశం తెరవండి.

        మీరు వారపు సారాంశం ఈమెయిల్ ఆన్ చేసినందున ఇది మీకు వచ్చింది. ఆపడానికి వారపు సారాంశంలో ఈమెయిల్ ఆఫ్ చేయండి.

        SchoolOS
