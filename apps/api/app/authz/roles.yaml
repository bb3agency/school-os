# System roles cloned into every school at provisioning (docs/07 §6.2; FR-IAM-010, FR-IAM-011).
# Versioned configuration shipped inside the package. The golden test
# apps/api/tests/authz/test_catalog.py parses the docs/07 §6.2 table and asserts this file
# matches it exactly, so change both together.
#
# Per role
#   name_en / name_te   display names (core.roles.name_en / name_te)
#   mfa_required        FR-IAM-002: sessions holding this role need the MFA claim (403 mfa_required)
#   membership_ttl_days memberships created with this role expire after N days (07 §6.2)
#   assign_any_role     holders may grant and revoke every role (the school's root of trust);
#                       everyone else may only grant roles whose permissions they hold
#   grants              permission -> school | scoped | school_step_up
#                         school          ✓  school-wide
#                         scoped          S  limited to the membership's class/section scopes
#                         school_step_up  ✓ᴿ school-wide, step-up MFA for changes
version: 1

roles:
  owner:
    name_en: Owner
    name_te: యజమాని
    mfa_required: true
    assign_any_role: true
    grants:
      circular.review: school
      task.read: school
      task.read_all: school
      task.manage: school
      notice.draft: school
      notice.approve: school
      tenant.settings.manage: school_step_up
      tenant.structure.manage: school
      tenant.billing.read: school
      user.manage: school_step_up
      role.assign: school_step_up
      student.read_basic: school
      student.read_sensitive: school
      student.identity_change.approve: school_step_up
      student.export: school_step_up
      dq.findings.read: school
      dq.readiness.read: school
      document.upload: school
      document.read: school
