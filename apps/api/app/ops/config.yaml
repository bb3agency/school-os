# Tenant-side ops configuration (FR-OPS-004; CLAUDE.md §6.13: retention periods live in versioned
# files, not in code). Shipped inside the package. Change together with tests/ops.
version: 1

outbox:
  # Lead decision D51 (2026-11-04): delivered (dispatched) outbox events are deleted this many
  # days after delivery by the nightly ops purge (beat ops.purge_idempotency_keys, 02:40 IST).
  # Undelivered events are kept until the dispatcher relays them.
  delivered_retention_days: 30
