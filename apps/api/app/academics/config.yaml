# Attendance, exams and marks (M5; FR-ATT-*, FR-MRK-*). Versioned configuration shipped inside the
# package (read by app/academics/config.py; CLAUDE.md invariant 13). Change together with
# tests/academics.
version: 1

attendance:
  # Codes accepted in attendance sheets (case-insensitive, after trimming) and the status each
  # one stores: the English letters of the paper register. Telugu abbreviations wait for the
  # schools' own register formats (PO question, 14 M5 status).
  codes:
    p: present
    present: present
    a: absent
    absent: absent
    l: late
    late: late
    lv: leave
    leave: leave
  # Entries per write request (a month of a large section: 31 days x 80 students).
  max_entries: 2500
  # Dates per sheet (one month of a register, with some slack).
  max_sheet_dates: 31
  # FT-11 (FR-ATT-026): hours a teacher's unsent day may stay on the device (browser storage:
  # student ids and statuses only) before the screen drops it. Lead decision D87 (PO to
  # confirm); 1 to 72.
  draft_keep_hours: 24

marks:
  max_subjects: 20
  max_subject_chars: 60
  max_marks_ceiling: 1000
  # Cell text meaning "absent from this paper" (case-insensitive).
  absent_codes: [ab, abs, absent]
  max_entries: 2500

sheets:
  # Header texts of the student column and the maximum-marks row. Compared after normalising
  # both sides the same way: NFC, lower case, everything but letters, marks and digits removed
  # (the same synonyms as app/imports/config.yaml where they overlap).
  admission_headers: [adm no, admn no, adm number, admission no, admission number, admission num,
                      ad no, admission, ప్రవేశ సంఖ్య, అడ్మిషన్ నంబర్, ప్రవేశ నంబర్]
  roll_headers: [roll no, roll number, roll, రోల్ నంబర్]
  # Optional name column: skipped, never stored or returned.
  name_headers: [name, student name, name of the student, name of student, students name,
                 full name, విద్యార్థి పేరు, పేరు]
  max_label_rows: [max marks, maximum marks, max, out of, గరిష్ఠ మార్కులు]
  # Readers' limits (app.core.spreadsheet): same zip-bomb and size guards as imports.
  limits:
    max_rows: 200
    max_columns: 40
    max_cell_chars: 200
    xlsx_max_uncompressed_bytes: 20971520   # 20 MB
    xlsx_max_compression_ratio: 200
    xlsx_max_members: 500
    max_scanned_rows: 2000
  max_file_bytes: 2097152                   # 2 MB: one section's register or marks sheet
  max_issues: 200                           # problems listed per preview (the rest are counted)

# FT-08 year-end progression pack (lead decision D85; FR-YRE-*). SchoolOS PROPOSES an annual
# result from the year's marks; the principal confirms every one (PRV-005: a person decides).
# Nothing here is applied automatically, and the RTE no-detention rule only WARNS.
year_end:
  # Bump when the proposal rule or the figures change (stored on each confirmed result).
  rule_version: 1
  # Proposal: "passed" at or above this overall percentage over the year's exams (sum of marks
  # / sum of maximum marks, absent papers left out: FR-MRK-005), "detained" below it (or
  # "promoted" in a no-detention class), "not_appeared" when the student has papers but was
  # absent from every one; no proposal without papers. UNVERIFIED (owner decision D3): boards
  # and schools differ (33% CBSE, 35% AP SSC, per subject there); FT-03 assessment schemes
  # replace this with the board's own formula.
  pass_percent: 35
  pass_percent_verified: false
  pass_percent_source: >-
    Common pass marks of Indian boards (33% CBSE, 35% AP SSC), per subject there; one overall
    percentage is a first version (docs/research/2026-11-features/teaching-academics.md FT-08).
    Not confirmed with a pilot school.
  # RTE no-detention: classes (by class code) where "detained" is never proposed and a confirmed
  # "detained" shows a warning (never refused). UNVERIFIED (owner decision D3): AP kept
  # no-detention for classes I-VIII after the RTE (Amendment) Rules 2024; no later AP order was
  # found.
  no_detention:
    verified: false
    class_codes: [I, II, III, IV, V, VI, VII, VIII]
    source: >-
      ThePrint, 23 Dec 2024, "Centre amends RTE rules, allows states/UTs to end no-detention
      policy for classes 5 and 8" (accessed 2026-11-09): the amendment binds central-government
      schools; Andhra Pradesh kept the policy for classes I-VIII.
  # Attendance statuses that count as a day attended (late is present, leave is not).
  attended_statuses: [present, late]
  # Results confirmed per request (one large section).
  max_entries: 200
  max_reason_chars: 500
  # UDISE+ progression sheet: students per sheet (one school's year).
  max_sheet_students: 5000

# FT-14 records completeness (lead decision D86, PO to confirm; FR-ATT-016.., FR-MRK-016..). The
# principal and the exam coordinator see per section how complete attendance and marks entry is
# (counts only) and the class teacher it waits on; never a teacher score or ranking. A person may
# send the section's class teacher an in-app reminder only while this is switched on: off until the
# PO decides whether teachers should be nudged at all (report question for FT-14).
completeness:
  reminders_enabled: false
