# Offboarding purge of one school's data (FR-PLT-005; ADR-0029; docs/16 §5.5, docs/05 §13).
# Versioned configuration shipped inside the package (read by app/tenancy/offboarding.py).
version: 1
# Modules that own school tables, in purge order (children before parents). Each registers its
# tenant_data_counts / purge_tenant_data with app.tenancy.service at import time. The purge
# refuses to start when any of them is not registered (fail closed).
purge_order:
  # R2-1A (ADR-0045): certificates before public, because sis.certificate_verifications
  # references core.public_handles (certificates reference only students, documents and the
  # academic structure, all purged later).
  - certificates
  # R3-1C (ADR-0051): disclosure rows reference public handles (the draft's link), documents and
  # their versions (published versions), so they go before public and documents.
  - disclosure
  # R2-1C (ADR-0043): messaging rows reference public handles, guardians and students, so they
  # go first.
  - messaging
  # R2-1B (ADR-0042): the fee ledger references students, documents, the structure and
  # members, so it goes before all of them (and before public, like every R2 module).
  - fees
  # R2-0 (ADR-0047): public handles next (they reference guardians and the school's keys'
  # tenant), before students (docs/05 §15.6).
  - public
  - tally
  # R3-1D (ADR-0053): ops.portal_reminders (dq) references ops.tasks (circulars), so dq goes
  # before circulars; nothing between them references dq's tables.
  - dq
  - circulars
  - insights
  - academics
  - knowledge
  - extraction
  - changes
  - apaar
  - students
  - imports
  - documents
  - exports
  - admin
  - notifications
  - breakglass
  - ops
  - identity
  - tenancy
# Modules that own files under the school prefix t/<tenant_id>/ (object storage).
object_owners:
  - documents
# Deferrable keys checked at commit instead of per statement (change requests and the attribute
# values that reference them go in one transaction; migration 0032).
deferred_constraints:
  - sis.attribute_values_change_request_fk
# Kept after the purge, deleted when their retention ends (product owner 2026-09-29).
retained:
  audit.events: School audit chain (IDs, codes, counts only); deleted after the audit retention.
  audit.chain_heads: Head of the school audit chain; deleted with the chain.
  audit.chain_verifications: Latest stored chain verification (counts, codes, a hash); deleted with the chain.
# Destroyed by the crypto-shredding step after the purge is verified.
keys_table: core.tenant_keys
