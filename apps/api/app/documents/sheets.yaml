# Sheet viewer and editor for XLSX/CSV documents (FR-DOC-009..011; CLAUDE.md §6.13: limits live
# in versioned files). Shipped inside the package. Change together with tests/documents.
version: 1

limits:
  # Opening a sheet reads the whole file on every page: bigger files are downloaded instead.
  max_file_bytes: 10485760          # 10 MB, the spreadsheet import limit (FR-IMP-001)
  max_rows: 5000                    # rows including the header row
  max_columns: 100
  max_cell_chars: 32000             # XLSX allows 32,767 characters per cell
  max_scanned_rows: 60000           # stop reading after this many physical rows
  # XLSX is a zip: refuse archives that inflate beyond these (zip bombs) before parsing.
  xlsx_max_uncompressed_bytes: 104857600
  xlsx_max_compression_ratio: 200
  xlsx_max_members: 2000

edits:
  max_cells: 5000                   # edited cells per save or download
  max_value_chars: 1000

# FR-EXP-003: an XLSX download of a sheet carries this watermark in its printed page header and
# file properties. Saved versions are school documents and carry none.
export_watermark:
  en: Generated by SchoolOS for internal checking
  te: అంతర్గత తనిఖీ కోసం SchoolOS రూపొందించింది
