# Notification templates used by app.extraction (FR-NOT-001), in the format of
# app/notifications/templates.yaml. That file belongs to the notifications module: these two
# entries are to be added there (request in the extraction report). Until then the extraction
# service skips the notification (logged as extraction.notify.skipped) and the tests load the
# templates from this file to prove they parse and render in English and Telugu.
templates:
  extraction.batch.ready:
    params: [batch_id, rows, low_confidence_rows]
    resource_type: extraction_batch
    en:
      title: Register photos are ready to check
      body: "{rows, plural, =0 {No rows were found on the photos. Check that each photo shows one register page clearly.} one {# row from the register photos is waiting for you to check.} other {# rows from the register photos are waiting for you to check.}} {low_confidence_rows, plural, =0 {} one {# row has unclear values, marked for a closer look.} other {# rows have unclear values, marked for a closer look.}}"
    te:
      title: రిజిస్టర్ ఫోటోలు తనిఖీకి సిద్ధంగా ఉన్నాయి
      body: "{rows, plural, =0 {ఫోటోలలో వరుసలు ఏవీ కనిపించలేదు. ప్రతి ఫోటోలో ఒక రిజిస్టర్ పేజీ స్పష్టంగా ఉందో లేదో చూడండి.} one {రిజిస్టర్ ఫోటోల నుండి # వరుస మీ తనిఖీ కోసం వేచి ఉంది.} other {రిజిస్టర్ ఫోటోల నుండి # వరుసలు మీ తనిఖీ కోసం వేచి ఉన్నాయి.}} {low_confidence_rows, plural, =0 {} one {# వరుసలో అస్పష్టమైన విలువలు ఉన్నాయి, జాగ్రత్తగా చూడండి.} other {# వరుసలలో అస్పష్టమైన విలువలు ఉన్నాయి, జాగ్రత్తగా చూడండి.}}"

  extraction.batch.failed:
    params: [batch_id]
    resource_type: extraction_batch
    en:
      title: Register photos could not be read
      body: The register photos could not be read. Try again later. If it happens again, contact SchoolOS support.
    te:
      title: రిజిస్టర్ ఫోటోలను చదవలేకపోయాము
      body: రిజిస్టర్ ఫోటోలను చదవలేకపోయాము. కొంత సమయం తర్వాత మళ్లీ ప్రయత్నించండి. మళ్లీ ఇలాగే జరిగితే SchoolOS సపోర్ట్‌ను సంప్రదించండి.
