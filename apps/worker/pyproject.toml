[project]
name = "sos-worker"
version = "0.1.0"
description = "SchoolOS Celery worker entrypoint (imports app.* tasks)"
requires-python = ">=3.12,<3.13"
dependencies = ["sos-api"]

[tool.uv.sources]
sos-api = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sos_worker"]
